          python -c "$(
            printf '%s\n' \
              'import json' \
              'from pathlib import PurePosixPath' \
              'import sys' \
              '' \
              'try:' \
              '    data = json.loads(sys.argv[1])' \
              'except json.JSONDecodeError as exc:' \
              '    raise SystemExit(f"version-source-locations-json is not valid JSON: {exc}") from exc' \
              'if not isinstance(data, list) or not data:' \
              '    raise SystemExit("version-source-locations-json must be a non-empty JSON array of repo-relative path strings")' \
              'normalized: list[str] = []' \
              'for item in data:' \
              '    if not isinstance(item, str):' \
              '        raise SystemExit("version-source-locations-json entries must be strings")' \
              '    candidate = item.strip()' \
              '    if not candidate or any(ch in candidate for ch in "\x00\r\n"):' \
              '        raise SystemExit("version-source-locations-json entries must be non-empty single-line strings")' \
              '    if "\\" in candidate:' \
              '        raise SystemExit("version-source-locations-json entries must use / separators")' \
              '    if candidate.startswith(("/", "\\")) or (len(candidate) >= 2 and candidate[1] == ":"):' \
