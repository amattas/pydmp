# aviato:managed profile=python-library version=2.0.0 hash=a48d3141c35402d361f4f6bba7acd66ecf4a58b641422061e9d256046fd59e17 inputs=fc765bd1af8b69911f2d2f19fa83781590b443d64723218e325418c024d742fc
name: Aviato Docs
on:
  workflow_run:
    workflows:
    - Aviato Python Library
    types:
    - completed
    branches:
    - main
permissions:
  contents: read
jobs:
  resolve:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      release: ${{ steps.tag.outputs.release }}
      publish-dev: ${{ steps.tag.outputs.publish-dev }}
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        ref: ${{ github.event.workflow_run.head_sha }}
        fetch-depth: 0
        fetch-tags: true
    - id: tag
      shell: bash
      env:
        HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      run: |
        set -euo pipefail
        # R7-4-DOCSTAGFILTER: the `--list '[0-9]*.[0-9]*.[0-9]*'` is a shell GLOB, broader than the
        # policy tag pattern (`1foo.2bar.3baz` matches). Post-filter with grep -E so release docs
        # only trigger on a real policy-conformant release tag. The trailing `|| true` is
        # load-bearing: grep exits 1 when NO tag matches (the normal default-branch dev case), and
        # under `set -euo pipefail` a failing command substitution fails the assignment and the
        # whole resolve job — the no-release case must be a clean dev publish, not a red run.
        tag="$(git tag --points-at "${HEAD_SHA}" --list '[0-9]*.[0-9]*.[0-9]*'             | grep -E '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta)[0-9]+)?$' | head -n1 || true)"
        # One grouped redirect per branch rather than a run of individual `>>` appends:
        # SC2129 flags the latter, and the actionlint step this workflow ships runs
        # ShellCheck over this very file in the consumer repo (issue #24). Note the
        # comment may not open with the linter's own name — that reads as a directive.
        if [ -n "${tag}" ]; then
          {
            echo "tag=${tag}"
            echo "release=true"
            echo "publish-dev=false"
          } >> "${GITHUB_OUTPUT}"
          echo "Resolved release tag ${tag} for docs deploy."
        else
          {
            echo "release=false"
            echo "publish-dev=true"
          } >> "${GITHUB_OUTPUT}"
          echo "No release tag at ${HEAD_SHA}; publishing dev docs."
        fi
  dev-docs--build:
    name: Build versioned docs
    if: ${{ needs.resolve.outputs.publish-dev == 'true' }}
    needs:
    - resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    concurrency: &id001
      group: pages-latest-${{ github.repository }}
      cancel-in-progress: false
    outputs:
      highest: ${{ steps.guard.outputs.highest }}
    defaults:
      run:
        working-directory: .
    steps:
    - name: Checkout consumer repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        ref: ${{ github.event.workflow_run.head_sha }}
        fetch-depth: 0
        fetch-tags: true
    - name: Resolve publish target
      id: target
      shell: bash
      env:
        PUBLISH_MODE: dev
        TAG_PATTERN: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta)[0-9]+)?$
        TAG_FORMAT_DESCRIPTION: N.N.N, N.N.N-alphaN, or N.N.N-betaN
        RELEASE_TAG_INPUT: ''
      run: |
        set -euo pipefail
        case "${PUBLISH_MODE}" in
          dev)
            echo "docs-version=dev" >> "${GITHUB_OUTPUT}"
            echo "highest=false" >> "${GITHUB_OUTPUT}"
            ;;
          release)
            if [ -n "${RELEASE_TAG_INPUT}" ]; then
              tag="${RELEASE_TAG_INPUT}"
            else
              if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
                echo "::error::Release workflows must run from a tag ref (or pass release-tag). Got ${GITHUB_REF_TYPE}:${GITHUB_REF_NAME}."
                exit 1
              fi
              tag="${GITHUB_REF_NAME}"
            fi
            if [[ ! "${tag}" =~ ${TAG_PATTERN} ]]; then
              echo "::error::Tag must match ${TAG_FORMAT_DESCRIPTION}. Got: ${tag}"
              exit 1
            fi
            echo "docs-version=${tag}" >> "${GITHUB_OUTPUT}"
            ;;
          *)
            echo "::error::publish-mode must be 'release' or 'dev'. Got: ${PUBLISH_MODE}"
            exit 1
            ;;
        esac
    - name: Verify tag still points at the gated commit (C12-W2)
      if: ${{ 'dev' == 'release' }}
      shell: bash
      env:
        RELEASE_TAG: ${{ steps.target.outputs.docs-version }}
        GATED_SHA: ${{ github.event.workflow_run.head_sha }}
      run: |
        set -euo pipefail
        actual="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}" 2>/dev/null || true)"
        if [ -z "${actual}" ] || [ "${actual}" != "${GATED_SHA}" ]; then
          echo "::error::Tag ${RELEASE_TAG} no longer points at the gated commit ${GATED_SHA} (now: ${actual:-missing}) — the tag moved between gate and deploy; refusing (C12-W2)."
          exit 1
        fi
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install docs toolchain (exact pins, §11.3)
      shell: bash
      env:
        DOCS_REQUIREMENTS: requirements-docs.txt
      run: |
        set -euo pipefail
        if [ ! -f "${DOCS_REQUIREMENTS}" ]; then
          echo "::error::docs requirements file ${DOCS_REQUIREMENTS} is missing; refusing an unpinned toolchain install (§11.3)."
          exit 1
        fi
        python3 -m pip install --quiet -r "${DOCS_REQUIREMENTS}"
    - name: Fetch existing docs branch
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        DOCS_BRANCH: gh-pages
      run: |
        set -euo pipefail
        remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        set +e
        git ls-remote --exit-code --heads "${remote}" "refs/heads/${DOCS_BRANCH}" >/dev/null
        status=$?
        set -e
        if [ "${status}" -eq 0 ]; then
          git fetch "${remote}" "+refs/heads/${DOCS_BRANCH}:refs/heads/${DOCS_BRANCH}"
        elif [ "${status}" -eq 2 ]; then
          echo "No existing ${DOCS_BRANCH} branch (first docs deploy)."
        else
          echo "::error::could not query origin for ${DOCS_BRANCH} (exit ${status}); refusing to build an orphan docs branch (fail closed)."
          exit 1
        fi
    - name: Emit language API docs
      if: |-
        ${{ '# §12.1 Python API reference (docstrings -> markdown) into the docs source tree.
        # §11.3: pin the pip-installed doc tool to an exact version (no floating latest).
        python3 -m pip install --quiet -e . "pydoc-markdown==4.8.2"
        mkdir -p docs/api
        pydoc-markdown -I . -p "pydmp" > docs/api/reference.md
        ' != '' }}
      shell: bash
      working-directory: .
      env:
        DOCS_EMIT_COMMAND: |
          # §12.1 Python API reference (docstrings -> markdown) into the docs source tree.
          # §11.3: pin the pip-installed doc tool to an exact version (no floating latest).
          python3 -m pip install --quiet -e . "pydoc-markdown==4.8.2"
          mkdir -p docs/api
          pydoc-markdown -I . -p "pydmp" > docs/api/reference.md
      run: eval "$DOCS_EMIT_COMMAND"
    - name: Monotonic guard
      if: ${{ 'dev' == 'release' }}
      id: guard
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ steps.target.outputs.docs-version }}
      run: |
        set -euo pipefail
        cat > /tmp/highest.py <<'PY'
        import sys, re
        rel = re.compile(r"^v?(\d+)\.(\d+)\.(\d+)(?:-(alpha|beta)(\d+))?$")
        rank = {None: 2, "beta": 1, "alpha": 0}
        def key(t):
            m = rel.match(t.strip())
            if not m:
                return None
            a, b, c, pre, pren = m.groups()
            return (int(a), int(b), int(c), rank[pre], int(pren or 0))
        cand = sys.argv[1]
        ck = key(cand)
        keys = [k for k in (key(t) for t in sys.stdin) if k]
        print("true" if ck and max(keys + [ck]) == ck else "false")
        PY
        if ! gh api --paginate "repos/${GITHUB_REPOSITORY}/tags" --jq '.[].name' > /tmp/tags.txt; then
          echo "::warning::Could not list tags; skipping docs deploy (fail-closed, §8.14)."
          echo "highest=false" >> "${GITHUB_OUTPUT}"
          exit 0
        fi
        echo "highest=$(python3 /tmp/highest.py "${RELEASE_TAG}" < /tmp/tags.txt)" >> "${GITHUB_OUTPUT}"
    - name: Refuse to target the default branch
      shell: bash
      env:
        DOCS_BRANCH: gh-pages
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        set -euo pipefail
        if [ -n "${DEFAULT_BRANCH}" ] && [ "${DOCS_BRANCH}" = "${DEFAULT_BRANCH}" ]; then
          echo "::error::docs-branch (${DOCS_BRANCH}) must not be the repository default branch."
          exit 1
        fi
    - name: Deploy version onto the local docs branch (mike)
      shell: bash
      env:
        PUBLISH_MODE: dev
        DOCS_VERSION: ${{ steps.target.outputs.docs-version }}
        DOCS_BRANCH: gh-pages
        HIGHEST: ${{ steps.guard.outputs.highest }}
        RETENTION: 0
      run: |
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        if [ "${PUBLISH_MODE}" = "dev" ]; then
          mike deploy --branch "${DOCS_BRANCH}" "${DOCS_VERSION}"
          exit 0
        fi
        # §8.14: EVERY policy-conformant release deploys its own version directory, but the
        # `latest` alias (and default) moves ONLY when this tag is the highest release.
        if [ "${HIGHEST}" = "true" ]; then
          mike deploy --branch "${DOCS_BRANCH}" --update-aliases "${DOCS_VERSION}" latest
          mike set-default --branch "${DOCS_BRANCH}" latest
        else
          echo "::warning::${DOCS_VERSION} is not the highest release; deploying its docs without moving latest (§8.14)."
          mike deploy --branch "${DOCS_BRANCH}" "${DOCS_VERSION}"
        fi
        if [ "${RETENTION}" -gt 0 ]; then
          python3 - "${RETENTION}" "${DOCS_BRANCH}" <<'PY'
        import re, subprocess, sys
        cap, branch = int(sys.argv[1]), sys.argv[2]
        rel = re.compile(r"^v?(\d+)\.(\d+)\.(\d+)(?:-(alpha|beta)(\d+))?$")
        rank = {None: 2, "beta": 1, "alpha": 0}
        def key(t):
            m = rel.match(t)
            return (int(m[1]), int(m[2]), int(m[3]), rank[m[4]], int(m[5] or 0)) if m else None
        out = subprocess.run(["mike", "list", "--branch", branch], check=True, capture_output=True, text=True).stdout
        versions = [line.split()[0] for line in out.splitlines() if line.strip()]
        keyed = sorted((v for v in versions if key(v)), key=key, reverse=True)
        for v in keyed[cap:]:
            subprocess.run(["mike", "delete", "--branch", branch, v], check=True)
            print(f"pruned {v}")
        PY
        fi
    - name: Bundle the docs branch for the push job
      shell: bash
      env:
        DOCS_BRANCH: gh-pages
      run: git bundle create /tmp/docs.bundle "refs/heads/${DOCS_BRANCH}"
    - name: Hand off docs branch bundle
      uses: actions/upload-artifact@v7
      with:
        name: aviato-docs-branch
        path: /tmp/docs.bundle
        retention-days: 1
        if-no-files-found: error
    - name: Materialize exact docs branch tree
      if: true
      shell: bash
      env:
        DOCS_BRANCH: gh-pages
        PAGES_ROOT: /tmp/aviato-pages-site
      run: |
        set -euo pipefail
        rm -rf "${PAGES_ROOT}"
        mkdir -p "${PAGES_ROOT}"
        # `git archive` with no explicit pathspec, invoked from a subdirectory of the
        # checkout (this job's working-directory may be e.g. "website" per profile),
        # implicitly restricts the archive to that subdirectory WITHIN the target
        # tree-ish. docs-branch is an orphan branch with a flat layout (version dirs,
        # `latest`, `versions.json` at the top level) that has no such subdirectory,
        # so archiving from a subdirectory silently produces an EMPTY archive — no
        # error, no non-zero exit. Always archive from the repository root so the
        # full docs-branch tree is materialized regardless of the docs layout.
        git -C "${GITHUB_WORKSPACE}" archive "refs/heads/${DOCS_BRANCH}" | tar -x -C "${PAGES_ROOT}"
        python3 - <<'PY'
        import os
        from pathlib import Path

        root = Path(os.environ["PAGES_ROOT"]).resolve()
        for path in root.rglob("*"):
            if not path.is_symlink():
                continue
            try:
                target = (path.parent / os.readlink(path)).resolve(strict=False)
                target.relative_to(root)
            except (OSError, RuntimeError, ValueError):
                raise SystemExit(f"refusing escaping symlink in Pages tree: {path.relative_to(root)}")
        PY
    - name: Configure GitHub Pages
      if: true
      uses: actions/configure-pages@v6
    - name: Upload GitHub Pages artifact
      if: true
      uses: actions/upload-pages-artifact@v5
      with:
        path: /tmp/aviato-pages-site
        include-hidden-files: true
  dev-docs--push:
    name: Push docs branch
    if: ${{ needs.resolve.outputs.publish-dev == 'true' }}
    needs:
    - dev-docs--build
    - resolve
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: *id001
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: true
        fetch-depth: 1
    - name: Fetch docs branch bundle
      uses: actions/download-artifact@v8
      with:
        name: aviato-docs-branch
        path: /tmp
    - name: Verify and fast-forward push
      shell: bash
      env:
        DOCS_BRANCH: gh-pages
      run: |
        set -euo pipefail
        git bundle verify /tmp/docs.bundle
        git fetch /tmp/docs.bundle "refs/heads/${DOCS_BRANCH}:refs/remotes/bundle/${DOCS_BRANCH}"
        if git fetch origin "+refs/heads/${DOCS_BRANCH}:refs/remotes/origin/${DOCS_BRANCH}" 2>/dev/null; then
          # Never rewrite published history: the bundle must extend what is on origin.
          if ! git merge-base --is-ancestor "refs/remotes/origin/${DOCS_BRANCH}" "refs/remotes/bundle/${DOCS_BRANCH}"; then
            echo "::error::bundle does not fast-forward origin/${DOCS_BRANCH}; refusing to push (concurrent deploy or rewritten history)."
            exit 1
          fi
        fi
        git push origin "refs/remotes/bundle/${DOCS_BRANCH}:refs/heads/${DOCS_BRANCH}"
  dev-docs--deploy:
    name: Deploy GitHub Pages
    if: ${{ (needs.resolve.outputs.publish-dev == 'true') && (true && success()) }}
    needs:
    - dev-docs--build
    - dev-docs--push
    - resolve
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency: *id001
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
  dev-docs:
    name: dev-docs (aggregate)
    if: ${{ always() && (needs.resolve.outputs.publish-dev == 'true') }}
    needs:
    - dev-docs--build
    - dev-docs--push
    - dev-docs--deploy
    - resolve
    runs-on: ubuntu-latest
    permissions: {}
    env:
      RESULT_0: ${{ needs.dev-docs--build.result }}
      RESULT_1: ${{ needs.dev-docs--push.result }}
      RESULT_2: ${{ needs.dev-docs--deploy.result }}
    steps:
    - name: Aggregate dev-docs
      shell: bash
      run: |
        set -euo pipefail
        # Aggregate the inlined dev-docs job graph: fail if any hoisted job
        # failed or was cancelled (a skipped job — e.g. a PR-only path on a tag run — is fine),
        # so downstream `needs.dev-docs.result` matches the reusable-call semantics.
        for r in "${RESULT_0}" "${RESULT_1}" "${RESULT_2}"; do
          case "${r}" in
            failure|cancelled) echo "::error::inlined dev-docs job did not succeed (${r})."; exit 1 ;;
          esac
        done
        echo "dev-docs: all inlined jobs succeeded or were skipped."
  release-gate:
    name: Validate release tag
    if: ${{ needs.resolve.outputs.release == 'true' }}
    needs:
    - resolve
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      gated-sha: ${{ steps.resolve-gated-sha.outputs.gated-sha }}
    steps:
    - name: Checkout consumer repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        fetch-depth: 0
        fetch-tags: true
    - name: Validate release tag
      shell: bash
      env:
        TAG_PATTERN: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta)[0-9]+)?$
        TAG_FORMAT_DESCRIPTION: N.N.N, N.N.N-alphaN, or N.N.N-betaN
        RELEASE_TAG_INPUT: ${{ needs.resolve.outputs.tag }}
      run: |
        set -euo pipefail
        # Two contexts: IN-RUN (release-tag input set, branch ref) or classic tag ref.
        if [ -n "${RELEASE_TAG_INPUT}" ]; then
          tag="${RELEASE_TAG_INPUT}"
        else
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::error::Release workflows must run from a tag ref (or pass release-tag). Got ${GITHUB_REF_TYPE}:${GITHUB_REF_NAME}."
            exit 1
          fi
          tag="${GITHUB_REF_NAME}"
        fi

        if [[ ! "${tag}" =~ ${TAG_PATTERN} ]]; then
          echo "::error::Tag must match ${TAG_FORMAT_DESCRIPTION}. Got: ${tag}"
          exit 1
        fi
        echo "RESOLVED_TAG=${tag}" >> "${GITHUB_ENV}"
    - name: Resolve gated commit
      id: resolve-gated-sha
      shell: bash
      env:
        RELEASE_TAG_INPUT: ${{ needs.resolve.outputs.tag }}
      run: |
        set -euo pipefail
        if [ -n "${RELEASE_TAG_INPUT}" ]; then
          # workflow_run and in-run callers execute in a branch/event context. The
          # release tag, not that event SHA, is the immutable release identity.
          gated_sha="$(git rev-parse "refs/tags/${RESOLVED_TAG}^{commit}")"
        else
          # A classic tag-triggered workflow already carries the release commit.
          gated_sha="$(git rev-parse "${GITHUB_SHA}^{commit}")"
        fi
        echo "gated-sha=${gated_sha}" >> "${GITHUB_OUTPUT}"
    - name: Verify tag points at default branch
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        DEFAULT_BRANCH: main
        GATED_SHA: ${{ steps.resolve-gated-sha.outputs.gated-sha }}
      run: |
        set -euo pipefail
        # Checkout deliberately does not persist the token. Scope authentication
        # to this one trusted fetch through process-local git config variables.
        if [ -n "${GH_TOKEN:-}" ]; then
          basic_auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${basic_auth}" \
            git fetch origin "${DEFAULT_BRANCH}" --tags
        else
          # Supports the executable workflow fixture's local-file remote.
          git fetch origin "${DEFAULT_BRANCH}" --tags
        fi
        # The resolved tag commit must be REACHABLE FROM the default branch. The event
        # SHA may be a later descendant when this gate runs from workflow_run.
        # R6-4-DOCSGATE: the previous strict equality (gated_sha == branch_tip) caused docs deploy
        # (which runs on workflow_run minutes after the main CI) to fail valid releases whenever
        # ANY unrelated push landed on the default branch in that window. The §5.9 invariant is
        # "the gated commit IS on the default branch's history" — is-ancestor is the correct check
        # (handles tip-equality AND the post-CI-push case). Reject only when off the branch.
        gated_commit="$(git rev-parse "${GATED_SHA}^{commit}")"
        branch_sha="$(git rev-parse "origin/${DEFAULT_BRANCH}")"

        if ! git merge-base --is-ancestor "${gated_commit}" "${branch_sha}"; then
          echo "::error::${RESOLVED_TAG} (${gated_commit}) is not reachable from origin/${DEFAULT_BRANCH} (${branch_sha})."
          exit 1
        fi
        if git rev-parse -q --verify "refs/tags/${RESOLVED_TAG}" >/dev/null; then
          tag_sha="$(git rev-parse "refs/tags/${RESOLVED_TAG}^{commit}")"
          if [ "${tag_sha}" != "${gated_commit}" ]; then
            echo "::error::Tag ${RESOLVED_TAG} (${tag_sha}) does not point at the gated commit ${gated_commit}."
            exit 1
          fi
        fi
    - name: Require merged pull request
      if: true
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        DEFAULT_BRANCH: main
        GATED_SHA: ${{ steps.resolve-gated-sha.outputs.gated-sha }}
      run: |
        set -euo pipefail
        owner="${GITHUB_REPOSITORY%%/*}"
        repo="${GITHUB_REPOSITORY#*/}"
        # $owner/$repo/$sha below are GraphQL variables (bound via -f), NOT shell vars,
        # so they intentionally do not expand in the single-quoted query (SC2016).
        # shellcheck disable=SC2016
        response="$(gh api graphql \
          -f owner="${owner}" \
          -f repo="${repo}" \
          -f sha="${GATED_SHA}" \
          -f query='
            query($owner: String!, $repo: String!, $sha: GitObjectID!) {
              repository(owner: $owner, name: $repo) {
                object(oid: $sha) {
                  ... on Commit {
                    associatedPullRequests(first: 20) {
                      nodes {
                        number
                        merged
                        baseRefName
                        headRefName
                        mergeCommit {
                          oid
                        }
                      }
                    }
                  }
                }
              }
            }')"

        pr_json="$(jq -c --arg sha "${GATED_SHA}" --arg base "${DEFAULT_BRANCH}" '
          .data.repository.object.associatedPullRequests.nodes[]
          | select(.merged == true and .baseRefName == $base and ((.mergeCommit.oid // $sha) == $sha))
        ' <<<"${response}" | head -n1)"

        if [ -z "${pr_json}" ]; then
          echo "::error::${RESOLVED_TAG} must point at the ${DEFAULT_BRANCH} tip associated with a merged PR."
          exit 1
        fi

        echo "Release tag is based on PR #$(jq -r '.number' <<<"${pr_json}") from $(jq -r '.headRefName' <<<"${pr_json}")."
    - name: Require successful workflow
      if: ${{ '' != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REQUIRED_WORKFLOW: ''
        DEFAULT_BRANCH: main
        GATED_SHA: ${{ steps.resolve-gated-sha.outputs.gated-sha }}
      run: |
        set -euo pipefail
        for _ in $(seq 1 60); do
          response="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${REQUIRED_WORKFLOW}/runs?head_sha=${GATED_SHA}&event=push&per_page=20")"
          matching_runs="$(jq --arg branch "${DEFAULT_BRANCH}" '[.workflow_runs[] | select(.head_branch == $branch)]' <<<"${response}")"
          run_count="$(jq 'length' <<<"${matching_runs}")"

          if [ "${run_count}" = "0" ]; then
            echo "Waiting for ${REQUIRED_WORKFLOW} on ${DEFAULT_BRANCH} for ${GATED_SHA}..."
            sleep 15
            continue
          fi

          successful_run="$(jq -r '
            map(select(.status == "completed" and .conclusion == "success"))
            | sort_by(.run_attempt, .created_at)
            | last
          ' <<<"${matching_runs}")"

          if [ "${successful_run}" != "null" ]; then
            run_id="$(jq -r '.id' <<<"${successful_run}")"
            echo "${REQUIRED_WORKFLOW} run ${run_id} succeeded for ${GATED_SHA}."
            exit 0
          fi

          active_runs="$(jq -r '[.[] | select(.status != "completed") | "\(.id):\(.status)"] | join(", ")' <<<"${matching_runs}")"
          if [ -n "${active_runs}" ]; then
            echo "Waiting on ${REQUIRED_WORKFLOW}: ${active_runs}"
            sleep 30
            continue
          fi

          failed_runs="$(jq -r '[.[] | "\(.id):\(.conclusion // "unknown")"] | join(", ")' <<<"${matching_runs}")"
          echo "::error::${REQUIRED_WORKFLOW} did not succeed on ${DEFAULT_BRANCH} for ${GATED_SHA}. Runs: ${failed_runs}"
          exit 1
        done

        echo "::error::Timed out waiting for ${REQUIRED_WORKFLOW} on ${DEFAULT_BRANCH}."
        exit 1
  security--resolve-target:
    name: Resolve analyzed target
    if: ${{ needs.resolve.outputs.release == 'true' }}
    needs:
    - resolve
    - release-gate
    runs-on: ubuntu-latest
    permissions: &id002
      contents: read
      pull-requests: read
      security-events: write
      actions: read
    outputs:
      canonical-ref: ${{ steps.canonicalize.outputs.canonical-ref }}
      analyzed-sha: ${{ steps.resolve.outputs.analyzed-sha }}
    steps:
    - name: Canonicalize requested ref
      id: canonicalize
      shell: bash
      env:
        REQUESTED_REF: refs/tags/${{ needs.resolve.outputs.tag }}
        EVENT_REF: ${{ github.ref }}
      run: |
        set -euo pipefail
        canonical_ref="${REQUESTED_REF:-${EVENT_REF}}"
        if [[ -n "${REQUESTED_REF}" && "${REQUESTED_REF}" != refs/* ]]; then
          canonical_ref="refs/tags/${REQUESTED_REF}"
        fi
        echo "canonical-ref=${canonical_ref}" >> "${GITHUB_OUTPUT}"
    - name: Fetch requested ref and tags
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        ref: ${{ steps.canonicalize.outputs.canonical-ref }}
        fetch-depth: 0
        fetch-tags: true
    - name: Resolve canonical ref and commit
      id: resolve
      shell: bash
      env:
        REQUESTED_SHA: ${{ needs.release-gate.outputs.gated-sha }}
        EVENT_SHA: ${{ github.sha }}
        CUSTOM_REF: refs/tags/${{ needs.resolve.outputs.tag }}
        CANONICAL_REF: ${{ steps.canonicalize.outputs.canonical-ref }}
      run: |
        set -euo pipefail
        # actions/checkout resolved CANONICAL_REF and fetched tags. Peeling
        # HEAD^{commit} makes annotated and lightweight tags converge on the commit scanners use.
        analyzed_sha="$(git rev-parse 'HEAD^{commit}')"
        expected_sha="${REQUESTED_SHA}"
        if [[ -z "${CUSTOM_REF}" && -z "${expected_sha}" ]]; then
          expected_sha="${EVENT_SHA}"
        fi
        if [[ -n "${expected_sha}" && "${analyzed_sha}" != "${expected_sha}" ]]; then
          echo "::error::Requested ref ${CANONICAL_REF} resolved to ${analyzed_sha}, expected ${expected_sha}."
          exit 1
        fi
        echo "analyzed-sha=${analyzed_sha}" >> "${GITHUB_OUTPUT}"
  security--privilege-probe:
    name: Probe findings-upload privilege
    if: ${{ needs.resolve.outputs.release == 'true' }}
    needs:
    - security--resolve-target
    - resolve
    - release-gate
    runs-on: ubuntu-latest
    permissions: *id002
    steps:
    - name: Jitter (scheduled runs only)
      if: ${{ github.event_name == 'schedule' }}
      shell: bash
      run: sleep $((RANDOM % 120))
    - name: Verify security-events scope
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
      run: |
        set -uo pipefail
        if gh api "repos/${REPO}/code-scanning/analyses?per_page=1" >/dev/null 2>err.txt; then
          echo "security-events scope present."
        elif grep -qiE '403|resource not accessible|forbidden|must have' err.txt; then
          echo "::error::Missing security-events privilege required for SARIF upload (§8.16)."
          cat err.txt
          exit 1
        elif grep -qiE 'HTTP 404' err.txt && grep -qiE 'no analysis|code scanning|not enabled|not set up' err.txt; then
          # Genuine first-run absence (code scanning has produced no analyses yet) is
          # the ONE tolerated failure shape — the scope itself is fine.
          echo "No analyses yet / code scanning not initialized; scope check passes."
        else
          # finding 8: an UNRECOGNIZED failure (5xx, rate limit, novel wording) must not
          # read as "scope appears present" — fail closed here rather than letting the
          # real failure surface later at SARIF upload (§5.14).
          echo "::error::Could not determine security-events scope (unexpected API failure); failing closed (§5.14)."
          cat err.txt
          exit 1
        fi
  security--codeql:
    name: CodeQL
    if: ${{ (needs.resolve.outputs.release == 'true') && (true && 'python' != '') }}
    needs:
    - security--privilege-probe
    - security--resolve-target
    - resolve
    - release-gate
    runs-on: ubuntu-latest
    permissions: *id002
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        ref: ${{ needs.security--resolve-target.outputs.analyzed-sha }}
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: python
    - name: Autobuild
      uses: github/codeql-action/autobuild@v4
    - name: Analyze
      uses: github/codeql-action/analyze@v4
      with:
        ref: ${{ needs.security--resolve-target.outputs.canonical-ref }}
        sha: ${{ needs.security--resolve-target.outputs.analyzed-sha }}
        wait-for-processing: true
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Gate CodeQL high/critical alerts
      env:
        GH_TOKEN: ${{ github.token }}
        ANALYZED_REF: ${{ needs.security--resolve-target.outputs.canonical-ref }}
      shell: bash
      run: |
        set -euo pipefail
        endpoint="$(python3 - <<'PY'
        import os
        from urllib.parse import quote

        repo = os.environ["GITHUB_REPOSITORY"]
        ref = quote(os.environ["ANALYZED_REF"], safe="")
        print(f"repos/{repo}/code-scanning/alerts?state=open&ref={ref}&tool_name=CodeQL&per_page=100")
        PY
        )"
        response="$(mktemp)"
        trap 'rm -f "${response}"' EXIT
        if ! gh api --paginate --slurp "${endpoint}" > "${response}"; then
          echo "::error::CodeQL alert query failed; refusing to treat an ambiguous result as clean."
          exit 1
        fi
        python3 - "${response}" <<'PY'
        import json
        import sys

        try:
            pages = json.load(open(sys.argv[1], encoding="utf-8"))
        except (OSError, json.JSONDecodeError) as exc:
            print(f"::error::CodeQL alert response was unreadable: {exc}")
            raise SystemExit(1) from exc
        if not pages or not isinstance(pages, list) or not all(isinstance(page, list) for page in pages):
            print("::error::CodeQL alert response did not contain an unambiguous paginated result.")
            raise SystemExit(1)

        blocking = []
        for page in pages:
            for alert in page:
                if not isinstance(alert, dict) or not isinstance(alert.get("rule"), dict):
                    print("::error::CodeQL alert response contained an invalid alert shape.")
                    raise SystemExit(1)
                rule = alert["rule"]
                if "security_severity_level" not in rule:
                    print("::error::CodeQL alert response omitted security_severity_level.")
                    raise SystemExit(1)
                severity = rule.get("security_severity_level")
                if severity not in (None, "low", "medium", "high", "critical"):
                    print("::error::CodeQL alert response contained an unknown security severity.")
                    raise SystemExit(1)
                number = alert.get("number")
                rule_id = rule.get("id")
                url = alert.get("html_url")
                if (
                    not isinstance(number, int)
                    or isinstance(number, bool)
                    or not isinstance(rule_id, str)
                    or not rule_id
                    or "\n" in rule_id
                    or "\r" in rule_id
                    or not isinstance(url, str)
                    or not url.startswith(("https://", "http://"))
                    or "\n" in url
                    or "\r" in url
                ):
                    print("::error::CodeQL alert response contained unsafe or missing display fields.")
                    raise SystemExit(1)
                if severity in ("high", "critical"):
                    blocking.append((number, rule_id, severity, url))

        for number, rule_id, severity, url in blocking:
            print(f"::error::CodeQL alert #{number}: rule={rule_id} severity={severity} url={url}")
        if blocking:
            print(f"::error::{len(blocking)} open high/critical CodeQL alert(s) block this ref.")
            raise SystemExit(1)
        print("No open high/critical CodeQL alerts for the analyzed ref and CodeQL tool.")
        PY
  security--dependency-review:
    name: Dependency Review
    if: ${{ (needs.resolve.outputs.release == 'true') && (true && github.event_name == 'pull_request') }}
    needs:
    - security--privilege-probe
    - security--resolve-target
    - resolve
    - release-gate
    runs-on: ubuntu-latest
    permissions: *id002
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        ref: ${{ needs.security--resolve-target.outputs.analyzed-sha }}
    - name: Dependency review
      uses: actions/dependency-review-action@v5
      with:
        fail-on-severity: high
  security--dependency-scan:
    name: Dependency vulnerability scan
    if: ${{ needs.resolve.outputs.release == 'true' }}
    needs:
    - security--privilege-probe
    - security--resolve-target
    - resolve
    - release-gate
    runs-on: ubuntu-latest
    permissions: *id002
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        ref: ${{ needs.security--resolve-target.outputs.analyzed-sha }}
    - name: Report dependency findings (all severities, no gate)
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        scan-type: fs
        scan-ref: .
        severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
        exit-code: '0'
        ignore-unfixed: true
        scanners: vuln
        format: sarif
        output: trivy-deps.sarif
    - name: Upload dependency findings
      if: ${{ always() }}
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: trivy-deps.sarif
        category: aviato-dependency-scan
        ref: ${{ needs.security--resolve-target.outputs.canonical-ref }}
        sha: ${{ needs.security--resolve-target.outputs.analyzed-sha }}
    - name: Gate on high/critical dependencies (§2.13)
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        scan-type: fs
        scan-ref: .
        severity: HIGH,CRITICAL
        exit-code: '1'
        ignore-unfixed: true
        scanners: vuln
        format: table
  security--secret-scan:
    name: Secret scan
    if: ${{ needs.resolve.outputs.release == 'true' }}
    needs:
    - security--privilege-probe
    - security--resolve-target
    - resolve
    - release-gate
    runs-on: ubuntu-latest
    permissions: *id002
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        ref: ${{ needs.security--resolve-target.outputs.analyzed-sha }}
    - name: Scan for secrets
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        scan-type: fs
        scan-ref: .
        exit-code: '1'
        scanners: secret
        format: sarif
        output: trivy-secrets.sarif
    - name: Upload secret findings
      if: ${{ always() }}
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: trivy-secrets.sarif
        category: aviato-secret-scan
        ref: ${{ needs.security--resolve-target.outputs.canonical-ref }}
        sha: ${{ needs.security--resolve-target.outputs.analyzed-sha }}
  security--heartbeat:
    name: Security baseline heartbeat
    if: ${{ (needs.resolve.outputs.release == 'true') && (always()) }}
    needs:
    - security--resolve-target
    - security--codeql
    - security--dependency-review
    - security--dependency-scan
    - security--secret-scan
    - resolve
    - release-gate
    runs-on: ubuntu-latest
    permissions: *id002
    env:
      CODEQL_RESULT: ${{ needs.security--codeql.result }}
      DEPSCAN_RESULT: ${{ needs.security--dependency-scan.result }}
      SECRET_RESULT: ${{ needs.security--secret-scan.result }}
      DEPREVIEW_RESULT: ${{ needs.security--dependency-review.result }}
      RUN_CODEQL: true
      CODEQL_LANGUAGES: python
      ANALYZED_REF: ${{ needs.security--resolve-target.outputs.canonical-ref }}
      ANALYZED_SHA: ${{ needs.security--resolve-target.outputs.analyzed-sha }}
    steps:
    - name: Emit heartbeat
      shell: bash
      run: |
        mkdir -p heartbeat
        printf '{"tool":"aviato-security-baseline","analyzed_ref":"%s","analyzed_sha":"%s","sast":"%s","dependency":"%s","secret":"%s","review":"%s","completed":true}\n' \
          "${ANALYZED_REF}" "${ANALYZED_SHA}" "${CODEQL_RESULT}" "${DEPSCAN_RESULT}" "${SECRET_RESULT}" "${DEPREVIEW_RESULT}" \
          > heartbeat/aviato-security-heartbeat.json
        cat heartbeat/aviato-security-heartbeat.json
    - name: Gate on required scans
      shell: bash
      run: |
        # The gating scans must have SUCCEEDED (skipped/failed/cancelled = broken, §5.14).
        for name in DEPSCAN SECRET; do
          eval "result=\${${name}_RESULT}"
          if [ "${result}" != "success" ]; then
            echo "::error::${name} scan did not run successfully (result=${result}); broken (§5.14)."
            exit 1
          fi
        done
        # SAST must not silently no-op: if CodeQL is enabled (run-codeql=true) it MUST
        # have succeeded. A skipped CodeQL (e.g. run-codeql=true but codeql-languages
        # left empty) is broken, not clean — absence reads as broken (§5.14/§8.16).
        if [ "${RUN_CODEQL}" = "true" ]; then
          if [ -z "${CODEQL_LANGUAGES}" ]; then
            echo "::error::run-codeql is true but codeql-languages is empty; SAST cannot run. Set codeql-languages (§5.14/§8.16)."
            exit 1
          fi
          if [ "${CODEQL_RESULT}" != "success" ]; then
            echo "::error::CodeQL SAST was enabled but did not succeed (result=${CODEQL_RESULT}); broken (§5.14/§8.16)."
            exit 1
          fi
        else
          # §2.13/§5.14: SAST is an ALWAYS-ON baseline — no profile may turn it off. A caller
          # passing run-codeql=false would skip SAST and (previously) pass the gate silently.
          # That is the §8.16 fail-open the baseline forbids: reject it.
          echo "::error::SAST is disabled (run-codeql=${RUN_CODEQL}); the §2.13 security baseline is always-on and cannot be turned off (§5.14/§8.16)."
          exit 1
        fi
    - name: Upload heartbeat
      uses: actions/upload-artifact@v7
      with:
        name: aviato-security-heartbeat-${{ needs.security--resolve-target.outputs.analyzed-sha }}
        path: heartbeat/aviato-security-heartbeat.json
        retention-days: 30
  security:
    name: security (aggregate)
    if: ${{ always() && (needs.resolve.outputs.release == 'true') }}
    needs:
    - security--resolve-target
    - security--privilege-probe
    - security--codeql
    - security--dependency-review
    - security--dependency-scan
    - security--secret-scan
    - security--heartbeat
    - resolve
    - release-gate
    runs-on: ubuntu-latest
    permissions: {}
    env:
      RESULT_0: ${{ needs.security--resolve-target.result }}
      RESULT_1: ${{ needs.security--privilege-probe.result }}
      RESULT_2: ${{ needs.security--codeql.result }}
      RESULT_3: ${{ needs.security--dependency-review.result }}
      RESULT_4: ${{ needs.security--dependency-scan.result }}
      RESULT_5: ${{ needs.security--secret-scan.result }}
      RESULT_6: ${{ needs.security--heartbeat.result }}
    steps:
    - name: Aggregate security
      shell: bash
      run: |
        set -euo pipefail
        # Aggregate the inlined security job graph: fail if any hoisted job
        # failed or was cancelled (a skipped job — e.g. a PR-only path on a tag run — is fine),
        # so downstream `needs.security.result` matches the reusable-call semantics.
        for r in "${RESULT_0}" "${RESULT_1}" "${RESULT_2}" "${RESULT_3}" "${RESULT_4}" "${RESULT_5}" "${RESULT_6}"; do
          case "${r}" in
            failure|cancelled) echo "::error::inlined security job did not succeed (${r})."; exit 1 ;;
          esac
        done
        echo "security: all inlined jobs succeeded or were skipped."
  docs--build:
    name: Build versioned docs
    if: ${{ needs.resolve.outputs.release == 'true' }}
    needs:
    - resolve
    - release-gate
    - security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    concurrency: &id003
      group: pages-latest-${{ github.repository }}
      cancel-in-progress: false
    outputs:
      highest: ${{ steps.guard.outputs.highest }}
    defaults:
      run:
        working-directory: .
    steps:
    - name: Checkout consumer repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        ref: ${{ needs.release-gate.outputs.gated-sha }}
        fetch-depth: 0
        fetch-tags: true
    - name: Resolve publish target
      id: target
      shell: bash
      env:
        PUBLISH_MODE: release
        TAG_PATTERN: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta)[0-9]+)?$
        TAG_FORMAT_DESCRIPTION: N.N.N, N.N.N-alphaN, or N.N.N-betaN
        RELEASE_TAG_INPUT: ${{ needs.resolve.outputs.tag }}
      run: |
        set -euo pipefail
        case "${PUBLISH_MODE}" in
          dev)
            echo "docs-version=dev" >> "${GITHUB_OUTPUT}"
            echo "highest=false" >> "${GITHUB_OUTPUT}"
            ;;
          release)
            if [ -n "${RELEASE_TAG_INPUT}" ]; then
              tag="${RELEASE_TAG_INPUT}"
            else
              if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
                echo "::error::Release workflows must run from a tag ref (or pass release-tag). Got ${GITHUB_REF_TYPE}:${GITHUB_REF_NAME}."
                exit 1
              fi
              tag="${GITHUB_REF_NAME}"
            fi
            if [[ ! "${tag}" =~ ${TAG_PATTERN} ]]; then
              echo "::error::Tag must match ${TAG_FORMAT_DESCRIPTION}. Got: ${tag}"
              exit 1
            fi
            echo "docs-version=${tag}" >> "${GITHUB_OUTPUT}"
            ;;
          *)
            echo "::error::publish-mode must be 'release' or 'dev'. Got: ${PUBLISH_MODE}"
            exit 1
            ;;
        esac
    - name: Verify tag still points at the gated commit (C12-W2)
      if: ${{ 'release' == 'release' }}
      shell: bash
      env:
        RELEASE_TAG: ${{ steps.target.outputs.docs-version }}
        GATED_SHA: ${{ needs.release-gate.outputs.gated-sha }}
      run: |
        set -euo pipefail
        actual="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}" 2>/dev/null || true)"
        if [ -z "${actual}" ] || [ "${actual}" != "${GATED_SHA}" ]; then
          echo "::error::Tag ${RELEASE_TAG} no longer points at the gated commit ${GATED_SHA} (now: ${actual:-missing}) — the tag moved between gate and deploy; refusing (C12-W2)."
          exit 1
        fi
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install docs toolchain (exact pins, §11.3)
      shell: bash
      env:
        DOCS_REQUIREMENTS: requirements-docs.txt
      run: |
        set -euo pipefail
        if [ ! -f "${DOCS_REQUIREMENTS}" ]; then
          echo "::error::docs requirements file ${DOCS_REQUIREMENTS} is missing; refusing an unpinned toolchain install (§11.3)."
          exit 1
        fi
        python3 -m pip install --quiet -r "${DOCS_REQUIREMENTS}"
    - name: Fetch existing docs branch
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        DOCS_BRANCH: gh-pages
      run: |
        set -euo pipefail
        remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        set +e
        git ls-remote --exit-code --heads "${remote}" "refs/heads/${DOCS_BRANCH}" >/dev/null
        status=$?
        set -e
        if [ "${status}" -eq 0 ]; then
          git fetch "${remote}" "+refs/heads/${DOCS_BRANCH}:refs/heads/${DOCS_BRANCH}"
        elif [ "${status}" -eq 2 ]; then
          echo "No existing ${DOCS_BRANCH} branch (first docs deploy)."
        else
          echo "::error::could not query origin for ${DOCS_BRANCH} (exit ${status}); refusing to build an orphan docs branch (fail closed)."
          exit 1
        fi
    - name: Emit language API docs
      if: |-
        ${{ '# §12.1 Python API reference (docstrings -> markdown) into the docs source tree.
        # §11.3: pin the pip-installed doc tool to an exact version (no floating latest).
        python3 -m pip install --quiet -e . "pydoc-markdown==4.8.2"
        mkdir -p docs/api
        pydoc-markdown -I . -p "pydmp" > docs/api/reference.md
        ' != '' }}
      shell: bash
      working-directory: .
      env:
        DOCS_EMIT_COMMAND: |
          # §12.1 Python API reference (docstrings -> markdown) into the docs source tree.
          # §11.3: pin the pip-installed doc tool to an exact version (no floating latest).
          python3 -m pip install --quiet -e . "pydoc-markdown==4.8.2"
          mkdir -p docs/api
          pydoc-markdown -I . -p "pydmp" > docs/api/reference.md
      run: eval "$DOCS_EMIT_COMMAND"
    - name: Monotonic guard
      if: ${{ 'release' == 'release' }}
      id: guard
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ steps.target.outputs.docs-version }}
      run: |
        set -euo pipefail
        cat > /tmp/highest.py <<'PY'
        import sys, re
        rel = re.compile(r"^v?(\d+)\.(\d+)\.(\d+)(?:-(alpha|beta)(\d+))?$")
        rank = {None: 2, "beta": 1, "alpha": 0}
        def key(t):
            m = rel.match(t.strip())
            if not m:
                return None
            a, b, c, pre, pren = m.groups()
            return (int(a), int(b), int(c), rank[pre], int(pren or 0))
        cand = sys.argv[1]
        ck = key(cand)
        keys = [k for k in (key(t) for t in sys.stdin) if k]
        print("true" if ck and max(keys + [ck]) == ck else "false")
        PY
        if ! gh api --paginate "repos/${GITHUB_REPOSITORY}/tags" --jq '.[].name' > /tmp/tags.txt; then
          echo "::warning::Could not list tags; skipping docs deploy (fail-closed, §8.14)."
          echo "highest=false" >> "${GITHUB_OUTPUT}"
          exit 0
        fi
        echo "highest=$(python3 /tmp/highest.py "${RELEASE_TAG}" < /tmp/tags.txt)" >> "${GITHUB_OUTPUT}"
    - name: Refuse to target the default branch
      shell: bash
      env:
        DOCS_BRANCH: gh-pages
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        set -euo pipefail
        if [ -n "${DEFAULT_BRANCH}" ] && [ "${DOCS_BRANCH}" = "${DEFAULT_BRANCH}" ]; then
          echo "::error::docs-branch (${DOCS_BRANCH}) must not be the repository default branch."
          exit 1
        fi
    - name: Deploy version onto the local docs branch (mike)
      shell: bash
      env:
        PUBLISH_MODE: release
        DOCS_VERSION: ${{ steps.target.outputs.docs-version }}
        DOCS_BRANCH: gh-pages
        HIGHEST: ${{ steps.guard.outputs.highest }}
        RETENTION: 0
      run: |
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        if [ "${PUBLISH_MODE}" = "dev" ]; then
          mike deploy --branch "${DOCS_BRANCH}" "${DOCS_VERSION}"
          exit 0
        fi
        # §8.14: EVERY policy-conformant release deploys its own version directory, but the
        # `latest` alias (and default) moves ONLY when this tag is the highest release.
        if [ "${HIGHEST}" = "true" ]; then
          mike deploy --branch "${DOCS_BRANCH}" --update-aliases "${DOCS_VERSION}" latest
          mike set-default --branch "${DOCS_BRANCH}" latest
        else
          echo "::warning::${DOCS_VERSION} is not the highest release; deploying its docs without moving latest (§8.14)."
          mike deploy --branch "${DOCS_BRANCH}" "${DOCS_VERSION}"
        fi
        if [ "${RETENTION}" -gt 0 ]; then
          python3 - "${RETENTION}" "${DOCS_BRANCH}" <<'PY'
        import re, subprocess, sys
        cap, branch = int(sys.argv[1]), sys.argv[2]
        rel = re.compile(r"^v?(\d+)\.(\d+)\.(\d+)(?:-(alpha|beta)(\d+))?$")
        rank = {None: 2, "beta": 1, "alpha": 0}
        def key(t):
            m = rel.match(t)
            return (int(m[1]), int(m[2]), int(m[3]), rank[m[4]], int(m[5] or 0)) if m else None
        out = subprocess.run(["mike", "list", "--branch", branch], check=True, capture_output=True, text=True).stdout
        versions = [line.split()[0] for line in out.splitlines() if line.strip()]
        keyed = sorted((v for v in versions if key(v)), key=key, reverse=True)
        for v in keyed[cap:]:
            subprocess.run(["mike", "delete", "--branch", branch, v], check=True)
            print(f"pruned {v}")
        PY
        fi
    - name: Bundle the docs branch for the push job
      shell: bash
      env:
        DOCS_BRANCH: gh-pages
      run: git bundle create /tmp/docs.bundle "refs/heads/${DOCS_BRANCH}"
    - name: Hand off docs branch bundle
      uses: actions/upload-artifact@v7
      with:
        name: aviato-docs-branch
        path: /tmp/docs.bundle
        retention-days: 1
        if-no-files-found: error
    - name: Materialize exact docs branch tree
      if: true
      shell: bash
      env:
        DOCS_BRANCH: gh-pages
        PAGES_ROOT: /tmp/aviato-pages-site
      run: |
        set -euo pipefail
        rm -rf "${PAGES_ROOT}"
        mkdir -p "${PAGES_ROOT}"
        # `git archive` with no explicit pathspec, invoked from a subdirectory of the
        # checkout (this job's working-directory may be e.g. "website" per profile),
        # implicitly restricts the archive to that subdirectory WITHIN the target
        # tree-ish. docs-branch is an orphan branch with a flat layout (version dirs,
        # `latest`, `versions.json` at the top level) that has no such subdirectory,
        # so archiving from a subdirectory silently produces an EMPTY archive — no
        # error, no non-zero exit. Always archive from the repository root so the
        # full docs-branch tree is materialized regardless of the docs layout.
        git -C "${GITHUB_WORKSPACE}" archive "refs/heads/${DOCS_BRANCH}" | tar -x -C "${PAGES_ROOT}"
        python3 - <<'PY'
        import os
        from pathlib import Path

        root = Path(os.environ["PAGES_ROOT"]).resolve()
        for path in root.rglob("*"):
            if not path.is_symlink():
                continue
            try:
                target = (path.parent / os.readlink(path)).resolve(strict=False)
                target.relative_to(root)
            except (OSError, RuntimeError, ValueError):
                raise SystemExit(f"refusing escaping symlink in Pages tree: {path.relative_to(root)}")
        PY
    - name: Configure GitHub Pages
      if: true
      uses: actions/configure-pages@v6
    - name: Upload GitHub Pages artifact
      if: true
      uses: actions/upload-pages-artifact@v5
      with:
        path: /tmp/aviato-pages-site
        include-hidden-files: true
  docs--push:
    name: Push docs branch
    if: ${{ needs.resolve.outputs.release == 'true' }}
    needs:
    - docs--build
    - resolve
    - release-gate
    - security
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: *id003
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: true
        fetch-depth: 1
    - name: Fetch docs branch bundle
      uses: actions/download-artifact@v8
      with:
        name: aviato-docs-branch
        path: /tmp
    - name: Verify and fast-forward push
      shell: bash
      env:
        DOCS_BRANCH: gh-pages
      run: |
        set -euo pipefail
        git bundle verify /tmp/docs.bundle
        git fetch /tmp/docs.bundle "refs/heads/${DOCS_BRANCH}:refs/remotes/bundle/${DOCS_BRANCH}"
        if git fetch origin "+refs/heads/${DOCS_BRANCH}:refs/remotes/origin/${DOCS_BRANCH}" 2>/dev/null; then
          # Never rewrite published history: the bundle must extend what is on origin.
          if ! git merge-base --is-ancestor "refs/remotes/origin/${DOCS_BRANCH}" "refs/remotes/bundle/${DOCS_BRANCH}"; then
            echo "::error::bundle does not fast-forward origin/${DOCS_BRANCH}; refusing to push (concurrent deploy or rewritten history)."
            exit 1
          fi
        fi
        git push origin "refs/remotes/bundle/${DOCS_BRANCH}:refs/heads/${DOCS_BRANCH}"
  docs--deploy:
    name: Deploy GitHub Pages
    if: ${{ (needs.resolve.outputs.release == 'true') && (true && success()) }}
    needs:
    - docs--build
    - docs--push
    - resolve
    - release-gate
    - security
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency: *id003
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
  docs:
    name: docs (aggregate)
    if: ${{ always() && (needs.resolve.outputs.release == 'true') }}
    needs:
    - docs--build
    - docs--push
    - docs--deploy
    - resolve
    - release-gate
    - security
    runs-on: ubuntu-latest
    permissions: {}
    env:
      RESULT_0: ${{ needs.docs--build.result }}
      RESULT_1: ${{ needs.docs--push.result }}
      RESULT_2: ${{ needs.docs--deploy.result }}
    steps:
    - name: Aggregate docs
      shell: bash
      run: |
        set -euo pipefail
        # Aggregate the inlined docs job graph: fail if any hoisted job
        # failed or was cancelled (a skipped job — e.g. a PR-only path on a tag run — is fine),
        # so downstream `needs.docs.result` matches the reusable-call semantics.
        for r in "${RESULT_0}" "${RESULT_1}" "${RESULT_2}"; do
          case "${r}" in
            failure|cancelled) echo "::error::inlined docs job did not succeed (${r})."; exit 1 ;;
          esac
        done
        echo "docs: all inlined jobs succeeded or were skipped."
