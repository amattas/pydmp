        # emit `tag` HERE (the tag phase) — not from `derive.next` — so the job's `tag` output is
        # set ONLY when a release was actually cut, matching its documented contract (empty on a
        # propose/no-release run, so a caller can't read a phantom tag).
        echo "released=true" >> "${GITHUB_OUTPUT}"
        echo "tag=${NEXT}" >> "${GITHUB_OUTPUT}"
        echo "Tagged and published ${NEXT}; deploy runs in-run from caller."
