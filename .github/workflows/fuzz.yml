# Fuzz: dispatch-only deep run of the ClusterFuzzLite targets (batch mode,
# 3600 s per target, total clamped to 19800 s). PR fuzzing runs inside Checks
# (`fuzz: true`). Finding handling: mattas-net/standards ci-cd/fuzzing.
name: Fuzz

on:
  workflow_dispatch:

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fuzz:
    uses: mattas-net/.github/.github/workflows/fuzz-batch.yml@main
    permissions:
      contents: read
      actions: read
    with:
      language: python
