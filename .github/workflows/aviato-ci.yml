        # strategy: a squash merge puts "chore(release): <NEXT>" on HEAD; a merge commit puts it
        # on the second parent (HEAD^2). R6-4-SQUASH: GitHub's DEFAULT squash-merge title format
        # appends " (#N)" (the PR number) to the PR title, so the merged subject is
        # `chore(release): NEXT (#42)` — a bare end-anchor would MISS it, silently fall through to
        # the propose phase, and the workflow would refuse to tag any release on a repo using the
        # default merge mode. Accept an optional `(#N)` suffix.
        is_release_commit() {
          git log -1 --format=%s "$1" 2>/dev/null | grep -Eq "^chore\(release\): ${NEXT}( \(#[0-9]+\))?\$"
