      last: ${{ steps.derive.outputs.last }}
      next: ${{ steps.derive.outputs.next }}
      release: ${{ steps.derive.outputs.release }}
      phase: ${{ steps.phase.outputs.phase }}
    env:
      VERSION_SOURCE_LOCATIONS_JSON: '["pyproject.toml"]'
    steps:
    - name: Checkout (full history)
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Verify managed release helpers
      shell: bash
      run: |
        set -euo pipefail
        required_helpers=(
          ".github/aviato/next-version.py"
          ".github/aviato/bump-version.py"
          ".github/aviato/is-highest.py"
