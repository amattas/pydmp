        response="$(gh api graphql \
          -f owner="${owner}" \
          -f repo="${repo}" \
          -f sha="${GATED_SHA}" \
          -f query='
            query($owner: String!, $repo: String!, $sha: GitObjectID!) {
              repository(owner: $owner, name: $repo) {
                object(oid: $sha) {
                  ... on Commit {
                    associatedPullRequests(first: 20) {
                      nodes {
                        number
                        merged
                        baseRefName
                        headRefName
                        mergeCommit {
                          oid
                        }
                      }
                    }
                  }
                }
              }
            }')"

        pr_json="$(jq -c --arg sha "${GATED_SHA}" --arg base "${DEFAULT_BRANCH}" '
          .data.repository.object.associatedPullRequests.nodes[]
          | select(.merged == true and .baseRefName == $base and ((.mergeCommit.oid // $sha) == $sha))
        ' <<<"${response}" | head -n1)"

        if [ -z "${pr_json}" ]; then
          echo "::error::${RESOLVED_TAG} must point at the ${DEFAULT_BRANCH} tip associated with a merged PR."
          exit 1
        fi

        echo "Release tag is based on PR #$(jq -r '.number' <<<"${pr_json}") from $(jq -r '.headRefName' <<<"${pr_json}")."
    - name: Require successful workflow
      if: ${{ '' != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REQUIRED_WORKFLOW: ''
        DEFAULT_BRANCH: main
        GATED_SHA: ${{ steps.resolve-gated-sha.outputs.gated-sha }}
      run: |
        set -euo pipefail
        for _ in $(seq 1 60); do
          response="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${REQUIRED_WORKFLOW}/runs?head_sha=${GATED_SHA}&event=push&per_page=20")"
          matching_runs="$(jq --arg branch "${DEFAULT_BRANCH}" '[.workflow_runs[] | select(.head_branch == $branch)]' <<<"${response}")"
          run_count="$(jq 'length' <<<"${matching_runs}")"

          if [ "${run_count}" = "0" ]; then
            echo "Waiting for ${REQUIRED_WORKFLOW} on ${DEFAULT_BRANCH} for ${GATED_SHA}..."
            sleep 15
            continue
          fi

          successful_run="$(jq -r '
            map(select(.status == "completed" and .conclusion == "success"))
            | sort_by(.run_attempt, .created_at)
            | last
          ' <<<"${matching_runs}")"

          if [ "${successful_run}" != "null" ]; then
            run_id="$(jq -r '.id' <<<"${successful_run}")"
            echo "${REQUIRED_WORKFLOW} run ${run_id} succeeded for ${GATED_SHA}."
            exit 0
          fi

          active_runs="$(jq -r '[.[] | select(.status != "completed") | "\(.id):\(.status)"] | join(", ")' <<<"${matching_runs}")"
          if [ -n "${active_runs}" ]; then
            echo "Waiting on ${REQUIRED_WORKFLOW}: ${active_runs}"
            sleep 30
            continue
          fi

          failed_runs="$(jq -r '[.[] | "\(.id):\(.conclusion // "unknown")"] | join(", ")' <<<"${matching_runs}")"
          echo "::error::${REQUIRED_WORKFLOW} did not succeed on ${DEFAULT_BRANCH} for ${GATED_SHA}. Runs: ${failed_runs}"
          exit 1
        done

        echo "::error::Timed out waiting for ${REQUIRED_WORKFLOW} on ${DEFAULT_BRANCH}."
        exit 1
  pypi--require-consumer-publisher:
    name: Require consumer-local PyPI publisher
    if: ${{ always() && needs.release-gate.result == 'success' && needs.security.result == 'success' && (github.ref_type == 'tag' || needs.release.outputs.released == 'true') }}
    needs:
    - release
    - release-gate
    - security
    runs-on: ubuntu-latest
    permissions: {}
    concurrency: &id003
      group: aviato-pypi-${{ github.repository }}
      cancel-in-progress: false
    steps:
    - name: Reject stale caller without trusted publisher
      if: ${{ true != true }}
      run: |
        echo "::error::This workflow predates the required consumer-local PyPI trusted publisher. Request an Aviato managed-file refresh."
        exit 1
  pypi--build:
    name: Build Python package
    if: ${{ always() && needs.release-gate.result == 'success' && needs.security.result == 'success' && (github.ref_type == 'tag' || needs.release.outputs.released == 'true') }}
    needs:
    - pypi--require-consumer-publisher
    - release
    - release-gate
    - security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency: *id003
    outputs:
      resolved-tag: ${{ steps.tag.outputs.resolved-tag }}
      artifact-name: aviato-pypi-dist
      distribution-name: ${{ steps.metadata.outputs.distribution-name }}
      package-version: ${{ steps.metadata.outputs.package-version }}
    defaults:
      run:
        working-directory: .
    steps:
    - name: Checkout consumer repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        ref: ${{ needs.release-gate.outputs.gated-sha }}
        fetch-depth: 0
        fetch-tags: true
    - name: Validate release tag
      id: tag
      shell: bash
      env:
        TAG_PATTERN: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta)[0-9]+)?$
        TAG_FORMAT_DESCRIPTION: N.N.N, N.N.N-alphaN, or N.N.N-betaN
        RELEASE_TAG_INPUT: ${{ needs.release.outputs.tag }}
      run: |
        set -euo pipefail
        if [ -n "${RELEASE_TAG_INPUT}" ]; then
          tag="${RELEASE_TAG_INPUT}"
        else
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::error::Release workflows must run from a tag ref (or pass release-tag). Got ${GITHUB_REF_TYPE}:${GITHUB_REF_NAME}."
            exit 1
          fi
          tag="${GITHUB_REF_NAME}"
        fi
        if [[ ! "${tag}" =~ ${TAG_PATTERN} ]]; then
          echo "::error::Tag must match ${TAG_FORMAT_DESCRIPTION}. Got: ${tag}"
          exit 1
        fi
        # resolved-tag crosses the job boundary to the publish job's "confirm resolvable" step.
        echo "resolved-tag=${tag}" >> "${GITHUB_OUTPUT}"
    - name: Verify tag still points at the gated commit (C12-W2)
      shell: bash
      env:
        RELEASE_TAG: ${{ steps.tag.outputs.resolved-tag }}
        GATED_SHA: ${{ needs.release-gate.outputs.gated-sha }}
      run: |
        set -euo pipefail
        actual="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}" 2>/dev/null || true)"
        if [ -z "${actual}" ] || [ "${actual}" != "${GATED_SHA}" ]; then
          echo "::error::Tag ${RELEASE_TAG} no longer points at the gated commit ${GATED_SHA} (now: ${actual:-missing}) — the tag moved between gate and build; refusing (C12-W2)."
          exit 1
        fi
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install build tools
      if: ${{ 'python -m pip install build==1.5.0' != '' }}
      shell: bash
      env:
        INSTALL_COMMAND: python -m pip install build==1.5.0
      run: eval "$INSTALL_COMMAND"
    - name: Build distributions
      shell: bash
      env:
        BUILD_COMMAND: python -m build
      run: eval "$BUILD_COMMAND"
    - name: Verify archive name and version contract
      id: metadata
      shell: bash
      env:
        PACKAGES_DIR: dist
        RELEASE_TAG: ${{ steps.tag.outputs.resolved-tag }}
      run: |
        set -euo pipefail
        python - <<'PY'
        import email.parser
        import os
        import pathlib
        import re
        import tarfile
        import zipfile

        dist = pathlib.Path(os.environ["PACKAGES_DIR"])
        archives = sorted(path for path in dist.iterdir() if path.is_file())
        if not archives:
            raise SystemExit("no distribution archives were built")

        def core_metadata(path: pathlib.Path) -> bytes:
            if path.suffix == ".whl" or path.suffix == ".zip":
                with zipfile.ZipFile(path) as archive:
                    candidates = [name for name in archive.namelist() if name.endswith(".dist-info/METADATA") or (name.endswith("/PKG-INFO") and name.count("/") == 1)]
                    if len(candidates) != 1:
                        raise SystemExit(f"{path.name}: expected exactly one core metadata file")
                    return archive.read(candidates[0])
            if path.name.endswith((".tar.gz", ".tar.bz2", ".tar.xz")):
                with tarfile.open(path, "r:*") as archive:
                    candidates = [member for member in archive.getmembers() if member.isfile() and member.name.endswith("/PKG-INFO") and member.name.count("/") == 1]
                    if len(candidates) != 1:
                        raise SystemExit(f"{path.name}: expected exactly one PKG-INFO")
                    handle = archive.extractfile(candidates[0])
                    if handle is None:
                        raise SystemExit(f"{path.name}: could not read PKG-INFO")
                    return handle.read()
            raise SystemExit(f"unsupported distribution archive: {path.name}")

        expected_version = re.sub(r"-(alpha|beta)([0-9]+)$", lambda m: {"alpha": "a", "beta": "b"}[m.group(1)] + m.group(2), os.environ["RELEASE_TAG"])
        identities = set()
        for path in archives:
            metadata = email.parser.BytesParser().parsebytes(core_metadata(path))
            name, version = metadata.get("Name"), metadata.get("Version")
            if not name or not version:
                raise SystemExit(f"{path.name}: core metadata is missing Name or Version")
            identities.add((name, version))
        if len(identities) != 1:
            raise SystemExit(f"distribution archives disagree on name/version: {sorted(identities)}")
        name, version = identities.pop()
        if version != expected_version:
            raise SystemExit(f"package version {version!r} does not match release tag {os.environ['RELEASE_TAG']!r} (expected {expected_version!r})")
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
            print(f"distribution-name={name}", file=output)
            print(f"package-version={version}", file=output)
        PY
    - name: Verify distribution metadata
      shell: bash
      env:
        TWINE_VERSION: 6.2.0
        PACKAGES_DIR: dist
      run: |
        # §11.3: pin the pip-installed tool to an exact version (not a floating latest).
        python -m pip install --quiet "twine==${TWINE_VERSION}"
        python -m twine check "${PACKAGES_DIR}"/*
    - name: Dependency vulnerability scan (gate)
      shell: bash
      env:
        PACKAGES_DIR: dist
        PIP_AUDIT_VERSION: 2.10.1
      run: |
        set -euo pipefail
        # AUDIT-SCOPE: scan EXACTLY the project's resolved dependency closure — nothing more.
        # Two live publish failures proved environment-mode auditing gates the publish on
        # things that never ship: on 0.2.0 the project ITSELF (absent from the index on a
        # first publish, its "could not be audited" skip is fatal under --strict, so a first
        # publish could never pass its own gate); on 0.2.1 the venv's runner-seeded pip
        # 25.0.1 (PYSEC-2026-196 et al.) — venv tooling, not a project dependency. So:
        #  - /tmp/project-venv holds the built wheel + its resolved deps (what ships);
        #  - /tmp/audit-venv holds the pip-audit scanner, so the scanner's own dependencies
        #    are never co-audited (or co-resolved) with the project's;
        #  - the audited set is `pip freeze` of the project venv (freeze omits venv tooling —
        #    pip/setuptools/wheel — by design) minus the project's own distribution(s),
        #    excluded by name: wheel filename fields are hyphen-separated with the name part
        #    underscore-normalized, so the first `-` field is exactly the distribution name.
        python -m venv /tmp/audit-venv
        python -m venv /tmp/project-venv
        # §11.3: pin the pip-installed scanner to an exact version (not a floating latest).
        /tmp/audit-venv/bin/python -m pip install --quiet "pip-audit==${PIP_AUDIT_VERSION}"
        # Install the built wheel so the project's dependency closure resolves exactly as shipped.
        /tmp/project-venv/bin/python -m pip install --quiet "${PACKAGES_DIR}"/*.whl
        exclude_args=()
        for wheel in "${PACKAGES_DIR}"/*.whl; do
          exclude_args+=(--exclude "$(basename "${wheel}" | cut -d- -f1)")
        done
        /tmp/project-venv/bin/python -m pip freeze "${exclude_args[@]}" > /tmp/project-reqs.txt
        # R7-1-PIPAUDIT-NOOP: REVERT to `--strict` (the prior fail-closed posture). The R6-2-PIPAUDIT
        # attempt at a "HIGH/CRITICAL only" gate (mirroring the GHCR `trivy --severity ...` pattern)
        # was structurally a NO-OP — pip-audit's OSV/PyPA service does NOT emit per-vuln severity in
        # its --format json output (each vuln carries only id/fix_versions/aliases/description),
        # verified empirically against jinja2==2.10 (10 known HIGH-severity CVEs, all gating-checked
        # to "no severity"). So substring-matching "critical"/"high" against aliases (which are
        # GHSA/CVE/PYSEC identifiers) never fires regardless of actual severity, and a previously
        # fail-closed control silently became fail-open. The pessimistic-but-correct posture is
        # `--strict` — any reported finding blocks the publish — until/unless we switch to a scanner
        # that does expose severity (e.g. osv-scanner, or a separate OSV/NVD lookup). See §11.7/§2.13.
        # `--no-deps` because the freeze output already IS the fully-pinned closure — no
        # resolution wanted; pip-audit warns about unhashed pins, which is acceptable here
        # (the set is generated in-job from the wheel install, not operator-supplied).
        /tmp/audit-venv/bin/python -m pip_audit --strict --no-deps --progress-spinner off -r /tmp/project-reqs.txt || {
          echo "::error::pip-audit found vulnerabilities in the project's dependencies (gating publish, §11.7/§2.13).";
          exit 1;
        }
    - name: Generate SBOM
      uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
      with:
        path: .
        format: cyclonedx-json
        output-file: ${{ '.' }}/sbom.cyclonedx.json
    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: aviato-pypi-dist
        path: |
          ${{ '.' }}/${{ 'dist' }}/
          ${{ '.' }}/sbom.cyclonedx.json
        if-no-files-found: error
        retention-days: 1
  pypi:
    name: pypi (aggregate)
    if: ${{ always() && (always() && needs.release-gate.result == 'success' && needs.security.result == 'success' && (github.ref_type == 'tag' || needs.release.outputs.released == 'true')) }}
    needs:
    - pypi--require-consumer-publisher
    - pypi--build
    - release
    - release-gate
    - security
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      resolved-tag: ${{ needs.pypi--build.outputs.resolved-tag }}
      artifact-name: ${{ needs.pypi--build.outputs.artifact-name }}
      distribution-name: ${{ needs.pypi--build.outputs.distribution-name }}
      package-version: ${{ needs.pypi--build.outputs.package-version }}
    env:
      RESULT_0: ${{ needs.pypi--require-consumer-publisher.result }}
      RESULT_1: ${{ needs.pypi--build.result }}
    steps:
    - name: Aggregate pypi
      shell: bash
      run: |
        set -euo pipefail
        # Aggregate the inlined pypi job graph: fail if any hoisted job
        # failed or was cancelled (a skipped job — e.g. a PR-only path on a tag run — is fine),
        # so downstream `needs.pypi.result` matches the reusable-call semantics.
        for r in "${RESULT_0}" "${RESULT_1}"; do
          case "${r}" in
            failure|cancelled) echo "::error::inlined pypi job did not succeed (${r})."; exit 1 ;;
          esac
        done
        echo "pypi: all inlined jobs succeeded or were skipped."
  pypi-publish:
    name: Publish Python package
    needs:
    - release-gate
    - pypi
    if: ${{ always() && needs.release-gate.result == 'success' && needs.pypi.result == 'success' }}
    runs-on: ubuntu-latest
    environment: pypi
    concurrency:
      group: aviato-pypi-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
    - name: Download vetted build artifacts
      uses: actions/download-artifact@v8
      with:
        name: ${{ needs.pypi.outputs.artifact-name }}
        path: .
    - name: Verify fresh remote tag after artifact download
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ needs.pypi.outputs.resolved-tag }}
        GATED_SHA: ${{ needs.release-gate.outputs.gated-sha }}
      run: |
        set -euo pipefail
        read -r object_type actual < <(gh api -H "Cache-Control: no-cache" "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.type + " " + .object.sha')
        for _ in 1 2 3 4 5; do
          [ "${object_type}" = "tag" ] || break
          read -r object_type actual < <(gh api -H "Cache-Control: no-cache" "repos/${GITHUB_REPOSITORY}/git/tags/${actual}" --jq '.object.type + " " + .object.sha')
        done
        if [ "${object_type}" != "commit" ] || [ "${actual}" != "${GATED_SHA}" ]; then
          echo "::error::Fresh remote tag ${RELEASE_TAG} does not peel to gated commit ${GATED_SHA} (type=${object_type}, sha=${actual})."
          exit 1
        fi
    - name: Attest build provenance
      uses: actions/attest-build-provenance@v4
      with:
        subject-path: dist/*
    - name: Attest SBOM
      uses: actions/attest-sbom@v4
      with:
        subject-path: dist/*
        sbom-path: sbom.cyclonedx.json
    - name: Resolve simple index endpoint
      id: index
      shell: bash
      env:
        REPOSITORY_URL: ${{ vars.PYPI_REPOSITORY_URL }}
        SIMPLE_INDEX_URL: ${{ vars.PYPI_SIMPLE_INDEX_URL }}
      run: |
        set -euo pipefail
        resolved="$(python - "${REPOSITORY_URL}" "${SIMPLE_INDEX_URL}" <<'PY'
        import sys
        import urllib.parse

        upload, explicit_simple = sys.argv[1:3]

        def validated(url: str, suffix: str) -> urllib.parse.SplitResult:
            try:
                parsed = urllib.parse.urlsplit(url)
                _ = parsed.port
            except ValueError as exc:
                raise SystemExit(f"invalid PyPI endpoint: {exc}") from exc
            if parsed.scheme != "https" or not parsed.hostname:
                raise SystemExit("PyPI endpoints must use HTTPS and include a hostname")
            if parsed.username is not None or parsed.password is not None:
                raise SystemExit("credentials are forbidden in PyPI endpoint URLs")
            if parsed.query or parsed.fragment or not parsed.path.endswith(suffix):
                raise SystemExit(f"PyPI endpoint must end in {suffix!r} with no query or fragment")
            return parsed

        if upload:
            upload_parts = validated(upload, "/legacy/")
            derived_path = upload_parts.path[: -len("legacy/")] + "simple/"
            derived = urllib.parse.urlunsplit(("https", upload_parts.netloc, derived_path, "", ""))
        else:
            derived = "https://pypi.org/simple/"
        if explicit_simple:
            validated(explicit_simple, "/simple/")
            resolved = explicit_simple
        else:
            resolved = derived
        print(resolved)
        PY
        )"
        echo "simple-index-url=${resolved}" >> "${GITHUB_OUTPUT}"
    - name: Final fresh remote tag verification
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ needs.pypi.outputs.resolved-tag }}
        GATED_SHA: ${{ needs.release-gate.outputs.gated-sha }}
      run: |
        set -euo pipefail
        read -r object_type actual < <(gh api -H "Cache-Control: no-cache" "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.type + " " + .object.sha')
        for _ in 1 2 3 4 5; do
          [ "${object_type}" = "tag" ] || break
          read -r object_type actual < <(gh api -H "Cache-Control: no-cache" "repos/${GITHUB_REPOSITORY}/git/tags/${actual}" --jq '.object.type + " " + .object.sha')
        done
        if [ "${object_type}" != "commit" ] || [ "${actual}" != "${GATED_SHA}" ]; then
          echo "::error::Fresh remote tag ${RELEASE_TAG} does not peel to gated commit ${GATED_SHA} (type=${object_type}, sha=${actual})."
          exit 1
        fi
    - name: Publish distributions
      if: ${{ vars.PYPI_REPOSITORY_URL == '' }}
      uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247
      with:
        packages-dir: dist
    - name: Publish distributions to alternate repository
      if: ${{ vars.PYPI_REPOSITORY_URL != '' }}
      uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247
      with:
        packages-dir: dist
        repository-url: ${{ vars.PYPI_REPOSITORY_URL }}
    - name: Confirm published artifacts
      shell: bash
      env:
        SIMPLE_INDEX_URL: ${{ steps.index.outputs.simple-index-url }}
        DISTRIBUTION_NAME: ${{ needs.pypi.outputs.distribution-name }}
        EXPECTED_VERSION: ${{ needs.pypi.outputs.package-version }}
        RELEASE_TAG: ${{ needs.pypi.outputs.resolved-tag }}
        DIST_DIR: dist
      run: |
        set -euo pipefail
        python - <<'PY'
        import hashlib
        import json
        import os
        import pathlib
        import re
        import time
        import urllib.error
        import urllib.parse
        import urllib.request

        release_tag = os.environ["RELEASE_TAG"]
        expected_from_tag = re.sub(r"-(alpha|beta)([0-9]+)$", lambda m: {"alpha": "a", "beta": "b"}[m.group(1)] + m.group(2), release_tag)
        if os.environ["EXPECTED_VERSION"] != expected_from_tag:
            raise SystemExit(f"builder version {os.environ['EXPECTED_VERSION']!r} does not match release tag {release_tag!r}")

        dist = pathlib.Path(os.environ["DIST_DIR"])
        local = {
            path.name: hashlib.sha256(path.read_bytes()).hexdigest()
            for path in sorted(dist.iterdir())
            # Distributions only: pypa/gh-action-pypi-publish >= 1.14 writes
            # *.publish.attestation sidecars into dist/ during upload, and the
            # simple index never lists sidecars (live 0.4.0 false-negative).
            if path.is_file() and path.name.endswith((".whl", ".tar.gz"))
        }
        if not local:
            raise SystemExit("no local distribution artifacts to confirm")
        normalized_name = re.sub(r"[-_.]+", "-", os.environ["DISTRIBUTION_NAME"]).lower()
        url = urllib.parse.urljoin(os.environ["SIMPLE_INDEX_URL"], urllib.parse.quote(normalized_name) + "/")
        request = urllib.request.Request(url, headers={"Accept": "application/vnd.pypi.simple.v1+json"})
        last_error = "index returned no matching files"
        for attempt in range(1, 11):
            try:
                with urllib.request.urlopen(request, timeout=30) as response:
                    payload = json.load(response)
                remote = {}
                for entry in payload.get("files", []):
                    filename = entry.get("filename")
                    sha256 = (entry.get("hashes") or {}).get("sha256")
                    if isinstance(filename, str) and isinstance(sha256, str):
                        remote[filename] = sha256.lower()
                mismatches = [name for name, digest in local.items() if remote.get(name) != digest]
                if not mismatches:
                    print(f"Confirmed {len(local)} published artifact(s) for {os.environ['DISTRIBUTION_NAME']}=={os.environ['EXPECTED_VERSION']} via PEP 691 metadata.")
                    raise SystemExit(0)
                last_error = f"missing or hash-mismatched files: {mismatches}"
            except (OSError, ValueError, json.JSONDecodeError, urllib.error.URLError) as exc:
                last_error = str(exc)
            print(f"PEP 691 confirmation attempt {attempt}/10 failed: {last_error}")
            if attempt < 10:
                time.sleep(30)
        raise SystemExit(f"published artifacts did not become verifiable: {last_error}")
        PY
