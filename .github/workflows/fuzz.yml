# Fuzz: deep run of the ClusterFuzzLite targets (batch mode, 600 s per target,
# total clamped to 19800 s) on a monthly schedule plus workflow_dispatch. The
# shared fuzz-batch workflow skips a scheduled run when main has no new commits
# since the last completed scheduled Fuzz run; dispatch always runs. PR fuzzing
# no longer runs; the corpus replay test in the normal test job is the PR-time
# check. Finding handling: mattas-net/standards ci-cd/fuzzing.
name: Fuzz

on:
  schedule:
    - cron: "0 6 1 * *"   # first of the month, 06:00 UTC; skipped by fuzz-batch when main has no new commits
  workflow_dispatch:

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fuzz:
    uses: mattas-net/.github/.github/workflows/fuzz-batch.yml@main
    permissions:
      contents: read
      actions: read
    with:
      language: python
