# Release: bump [project].version in pyproject.toml, merge to main, then
# Actions -> Release -> Run workflow -> enter that version (bare semver, e.g. 1.2.0
# or 1.2.0-beta1). create-release.yml verifies the manifest and the passing CI run
# on main HEAD, then tags main and creates the GitHub release; the build then runs
# from that tag. Publishing runs in the `pypi` environment (required reviewer gate);
# PyPI trusted publishing must be registered for workflow `release.yml` +
# environment `pypi`. The built files are attached to the existing release after a
# successful publish; the final `docs` job then rebuilds the versioned docs.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (bare semver, e.g. 1.4.2)
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    uses: amattas/.github/.github/workflows/create-release.yml@main
    permissions:
      contents: write
      actions: read
    with:
      version: ${{ inputs.version }}
      manifest: pyproject.toml
      require-workflow: CI

  build:
    name: Build and verify
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.version }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --quiet -e ".[dev]" twine==6.2.0
      - name: Test
        run: python -m pytest -q --no-cov
      - name: Build and check
        run: |
          python -m build
          python -m twine check dist/*
      - name: Verify tag matches the built version
        env:
          TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python - "${TAG}" dist/*.whl <<'PY'
          import sys
          from pathlib import Path
          from packaging.version import Version

          tag, wheel = sys.argv[1], Path(sys.argv[2]).name
          built = Version(wheel.split("-")[1])
          if Version(tag) != built:
              sys.exit(f"::error::built version {built} != tag {tag} - bump pyproject.toml first")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    environment: pypi # must match the PyPI trusted publisher registration
    concurrency:
      group: pypi-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write # attach files to the GitHub release
      id-token: write # PyPI trusted publishing (OIDC)
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*"
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1 (v1.14.1)
        with:
          packages-dir: dist
      - name: Attach the build to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          gh release upload "${TAG}" dist/*.whl dist/*.tar.gz --repo "${GITHUB_REPOSITORY}"

  docs:
    name: Docs
    needs: [publish]
    permissions:
      contents: write # docs.yml: mike pushes the gh-pages branch
    uses: ./.github/workflows/docs.yml
