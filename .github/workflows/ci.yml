# CI — runs automatically on every push to main; run it manually (Actions tab →
# Run workflow) to verify any other branch. The Release workflow requires a
# successful run of this workflow on main HEAD.
#
# When run on main and all gating jobs pass, the final `docs` job calls docs.yml
# to republish the versioned docs ("dev" = main). A newer CI run on main cancels
# this run (incl. an in-flight docs call); its own docs job then republishes.
#
# Required checks (default-branch ruleset): "Python CI" and "Security".
# CodeQL is enforced separately by the ruleset's code-scanning rule.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  approve:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    environment: approval
    steps:
      - run: echo "Checks approved by ${GITHUB_TRIGGERING_ACTOR}"

  ci:
    name: Python CI
    needs: approve
    # Runs when approve passed or was skipped (push/dispatch); a rejected approval stops it.
    if: always() && needs.approve.result != 'failure' && needs.approve.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --quiet -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Lint workflows
        run: docker run --rm -v "${PWD}:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color
      - name: Type-check
        run: python -m mypy --strict .
      - name: Test
        run: python -m pytest -q --no-cov
      - name: Build
        run: python -m build

  security:
    name: Security
    needs: approve
    if: always() && needs.approve.result != 'failure' && needs.approve.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Dependency review (vulnerable deps introduced vs main)
        uses: actions/dependency-review-action@v5
        with:
          base-ref: main
          head-ref: ${{ github.sha }}
          fail-on-severity: high
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --quiet ".[dev]" pip-audit==2.10.1
      - name: Audit installed dependencies (known vulnerabilities)
        run: pip-audit --strict

  codeql:
    name: CodeQL
    needs: approve
    if: always() && needs.approve.result != 'failure' && needs.approve.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: python
      - uses: github/codeql-action/analyze@v4

  docs:
    name: Docs
    needs: [ci, security, codeql]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write # docs.yml: mike pushes the gh-pages branch
    uses: ./.github/workflows/docs.yml
