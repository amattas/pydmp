# aviato:managed profile=python-library version=2.0.0 hash=7a6e1e2f293b7db66cb8a8f0bf3aaebb14c0e87718383d77374edd74a4920578 inputs=fc765bd1af8b69911f2d2f19fa83781590b443d64723218e325418c024d742fc
name: Aviato Python Library
on:
  pull_request:
    branches:
    - main
  push:
    branches:
    - main
    tags:
    - '*.*.*'
  schedule:
  - cron: 23 5 * * 1
  workflow_dispatch: null
permissions:
  contents: write
  pull-requests: write
  security-events: write
  actions: write
  statuses: write
jobs:
  pick-runner:
    name: Pick runner
    if: ${{ false }}
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
    - name: Probe self-hosted runner availability
      id: check
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.RUNNER_STATUS_PAT }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      run: |
        set -euo pipefail
        # Default to the GitHub-hosted runner and only ever narrow to self-hosted below, so every
        # failure mode (fork PR, missing PAT, API error, no runner online) lands on hosted.
        runner='["ubuntu-latest"]'
        # Fork safety: a pull_request from a fork runs untrusted code, which must never reach a
        # self-hosted runner. Only pushes and same-repo PRs qualify. HEAD_REPO is attacker-influenced,
        # so it arrives through env and is only ever compared — never interpolated into this script.
        if [ "${GITHUB_EVENT_NAME}" != "pull_request" ] || [ "${HEAD_REPO}" = "${GITHUB_REPOSITORY}" ]; then
          if [ -n "${GH_TOKEN:-}" ]; then
            online=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runners" \
              --jq '[.runners[] | select(.status == "online")] | length' || echo 0)
            if [ "${online:-0}" -gt 0 ]; then
              runner='["self-hosted"]'
            fi
          fi
        fi
        echo "runner=${runner}" >> "$GITHUB_OUTPUT"
  ci:
    name: Python CI
    if: ${{ !cancelled() && (github.ref_type != 'tag' && github.event_name != 'schedule') }}
    needs:
    - pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.runner || '["ubuntu-latest"]') }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: pip
    - name: Install
      if: ${{ true && 'python -m pip install -e .[dev]' != '' }}
      shell: bash
      env:
        INSTALL_COMMAND: python -m pip install -e .[dev]
      run: eval "$INSTALL_COMMAND"
    - name: Lint
      if: ${{ true && 'python -m ruff check .' != '' }}
      shell: bash
      env:
        LINT_COMMAND: python -m ruff check .
      run: eval "$LINT_COMMAND"
    - name: Format check
      if: ${{ true && 'python -m ruff format --check .' != '' }}
      shell: bash
      env:
        FORMAT_COMMAND: python -m ruff format --check .
      run: eval "$FORMAT_COMMAND"
    - name: Type check
      if: ${{ true && 'python -m mypy --strict .' != '' }}
      shell: bash
      env:
        TYPECHECK_COMMAND: python -m mypy --strict .
      run: eval "$TYPECHECK_COMMAND"
    - name: Test
      if: ${{ true && 'python -m pytest --cov --cov-report=term-missing' != '' }}
      shell: bash
      env:
        TEST_COMMAND: python -m pytest --cov --cov-report=term-missing
      run: eval "$TEST_COMMAND"
    - name: Build
      if: ${{ true && 'python -m build' != '' }}
      shell: bash
      env:
        BUILD_COMMAND: python -m build
      run: eval "$BUILD_COMMAND"
  security--resolve-target:
    name: Resolve analyzed target
    runs-on: ubuntu-latest
    permissions: &id001
      contents: read
      pull-requests: read
      security-events: write
      actions: read
    outputs:
      canonical-ref: ${{ steps.canonicalize.outputs.canonical-ref }}
      analyzed-sha: ${{ steps.resolve.outputs.analyzed-sha }}
    steps:
    - name: Canonicalize requested ref
      id: canonicalize
      shell: bash
      env:
        REQUESTED_REF: ''
        EVENT_REF: ${{ github.ref }}
      run: |
        set -euo pipefail
        canonical_ref="${REQUESTED_REF:-${EVENT_REF}}"
        if [[ -n "${REQUESTED_REF}" && "${REQUESTED_REF}" != refs/* ]]; then
          canonical_ref="refs/tags/${REQUESTED_REF}"
        fi
        echo "canonical-ref=${canonical_ref}" >> "${GITHUB_OUTPUT}"
    - name: Fetch requested ref and tags
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        ref: ${{ steps.canonicalize.outputs.canonical-ref }}
        fetch-depth: 0
        fetch-tags: true
    - name: Resolve canonical ref and commit
      id: resolve
      shell: bash
      env:
        REQUESTED_SHA: ''
        EVENT_SHA: ${{ github.sha }}
        CUSTOM_REF: ''
        CANONICAL_REF: ${{ steps.canonicalize.outputs.canonical-ref }}
      run: |
        set -euo pipefail
        # actions/checkout resolved CANONICAL_REF and fetched tags. Peeling
        # HEAD^{commit} makes annotated and lightweight tags converge on the commit scanners use.
        analyzed_sha="$(git rev-parse 'HEAD^{commit}')"
        expected_sha="${REQUESTED_SHA}"
        if [[ -z "${CUSTOM_REF}" && -z "${expected_sha}" ]]; then
          expected_sha="${EVENT_SHA}"
        fi
        if [[ -n "${expected_sha}" && "${analyzed_sha}" != "${expected_sha}" ]]; then
          echo "::error::Requested ref ${CANONICAL_REF} resolved to ${analyzed_sha}, expected ${expected_sha}."
          exit 1
        fi
        echo "analyzed-sha=${analyzed_sha}" >> "${GITHUB_OUTPUT}"
  security--privilege-probe:
    name: Probe findings-upload privilege
    needs:
    - security--resolve-target
    runs-on: ubuntu-latest
    permissions: *id001
    steps:
    - name: Jitter (scheduled runs only)
      if: ${{ github.event_name == 'schedule' }}
      shell: bash
      run: sleep $((RANDOM % 120))
    - name: Verify security-events scope
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
      run: |
        set -uo pipefail
        if gh api "repos/${REPO}/code-scanning/analyses?per_page=1" >/dev/null 2>err.txt; then
          echo "security-events scope present."
        elif grep -qiE '403|resource not accessible|forbidden|must have' err.txt; then
          echo "::error::Missing security-events privilege required for SARIF upload (§8.16)."
          cat err.txt
          exit 1
        elif grep -qiE 'HTTP 404' err.txt && grep -qiE 'no analysis|code scanning|not enabled|not set up' err.txt; then
          # Genuine first-run absence (code scanning has produced no analyses yet) is
          # the ONE tolerated failure shape — the scope itself is fine.
          echo "No analyses yet / code scanning not initialized; scope check passes."
        else
          # finding 8: an UNRECOGNIZED failure (5xx, rate limit, novel wording) must not
          # read as "scope appears present" — fail closed here rather than letting the
          # real failure surface later at SARIF upload (§5.14).
          echo "::error::Could not determine security-events scope (unexpected API failure); failing closed (§5.14)."
          cat err.txt
          exit 1
        fi
  security--codeql:
    name: CodeQL
    if: ${{ true && 'python' != '' }}
    needs:
    - security--privilege-probe
    - security--resolve-target
    runs-on: ubuntu-latest
    permissions: *id001
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        ref: ${{ needs.security--resolve-target.outputs.analyzed-sha }}
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: python
    - name: Autobuild
      uses: github/codeql-action/autobuild@v4
    - name: Analyze
      uses: github/codeql-action/analyze@v4
      with:
        ref: ${{ needs.security--resolve-target.outputs.canonical-ref }}
        sha: ${{ needs.security--resolve-target.outputs.analyzed-sha }}
        wait-for-processing: true
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Gate CodeQL high/critical alerts
      env:
        GH_TOKEN: ${{ github.token }}
        ANALYZED_REF: ${{ needs.security--resolve-target.outputs.canonical-ref }}
      shell: bash
      run: |
        set -euo pipefail
        endpoint="$(python3 - <<'PY'
        import os
        from urllib.parse import quote

        repo = os.environ["GITHUB_REPOSITORY"]
        ref = quote(os.environ["ANALYZED_REF"], safe="")
        print(f"repos/{repo}/code-scanning/alerts?state=open&ref={ref}&tool_name=CodeQL&per_page=100")
        PY
        )"
        response="$(mktemp)"
        trap 'rm -f "${response}"' EXIT
        if ! gh api --paginate --slurp "${endpoint}" > "${response}"; then
          echo "::error::CodeQL alert query failed; refusing to treat an ambiguous result as clean."
          exit 1
        fi
        python3 - "${response}" <<'PY'
        import json
        import sys

        try:
            pages = json.load(open(sys.argv[1], encoding="utf-8"))
        except (OSError, json.JSONDecodeError) as exc:
            print(f"::error::CodeQL alert response was unreadable: {exc}")
            raise SystemExit(1) from exc
        if not pages or not isinstance(pages, list) or not all(isinstance(page, list) for page in pages):
            print("::error::CodeQL alert response did not contain an unambiguous paginated result.")
            raise SystemExit(1)

        blocking = []
        for page in pages:
            for alert in page:
                if not isinstance(alert, dict) or not isinstance(alert.get("rule"), dict):
                    print("::error::CodeQL alert response contained an invalid alert shape.")
                    raise SystemExit(1)
                rule = alert["rule"]
                if "security_severity_level" not in rule:
                    print("::error::CodeQL alert response omitted security_severity_level.")
                    raise SystemExit(1)
                severity = rule.get("security_severity_level")
                if severity not in (None, "low", "medium", "high", "critical"):
                    print("::error::CodeQL alert response contained an unknown security severity.")
                    raise SystemExit(1)
                number = alert.get("number")
                rule_id = rule.get("id")
                url = alert.get("html_url")
                if (
                    not isinstance(number, int)
                    or isinstance(number, bool)
                    or not isinstance(rule_id, str)
                    or not rule_id
                    or "\n" in rule_id
                    or "\r" in rule_id
                    or not isinstance(url, str)
                    or not url.startswith(("https://", "http://"))
                    or "\n" in url
                    or "\r" in url
                ):
                    print("::error::CodeQL alert response contained unsafe or missing display fields.")
                    raise SystemExit(1)
                if severity in ("high", "critical"):
                    blocking.append((number, rule_id, severity, url))

        for number, rule_id, severity, url in blocking:
            print(f"::error::CodeQL alert #{number}: rule={rule_id} severity={severity} url={url}")
        if blocking:
            print(f"::error::{len(blocking)} open high/critical CodeQL alert(s) block this ref.")
            raise SystemExit(1)
        print("No open high/critical CodeQL alerts for the analyzed ref and CodeQL tool.")
        PY
  security--dependency-review:
    name: Dependency Review
    if: ${{ true && github.event_name == 'pull_request' }}
    needs:
    - security--privilege-probe
    - security--resolve-target
    runs-on: ubuntu-latest
    permissions: *id001
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        ref: ${{ needs.security--resolve-target.outputs.analyzed-sha }}
    - name: Dependency review
      uses: actions/dependency-review-action@v5
      with:
        fail-on-severity: high
  security--dependency-scan:
    name: Dependency vulnerability scan
    needs:
    - security--privilege-probe
    - security--resolve-target
    runs-on: ubuntu-latest
    permissions: *id001
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        ref: ${{ needs.security--resolve-target.outputs.analyzed-sha }}
    - name: Report dependency findings (all severities, no gate)
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        scan-type: fs
        scan-ref: .
        severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
        exit-code: '0'
        ignore-unfixed: true
        scanners: vuln
        format: sarif
        output: trivy-deps.sarif
    - name: Upload dependency findings
      if: ${{ always() }}
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: trivy-deps.sarif
        category: aviato-dependency-scan
        ref: ${{ needs.security--resolve-target.outputs.canonical-ref }}
        sha: ${{ needs.security--resolve-target.outputs.analyzed-sha }}
    - name: Gate on high/critical dependencies (§2.13)
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        scan-type: fs
        scan-ref: .
        severity: HIGH,CRITICAL
        exit-code: '1'
        ignore-unfixed: true
        scanners: vuln
        format: table
  security--secret-scan:
    name: Secret scan
    needs:
    - security--privilege-probe
    - security--resolve-target
    runs-on: ubuntu-latest
    permissions: *id001
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        ref: ${{ needs.security--resolve-target.outputs.analyzed-sha }}
    - name: Scan for secrets
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        scan-type: fs
        scan-ref: .
        exit-code: '1'
        scanners: secret
        format: sarif
        output: trivy-secrets.sarif
    - name: Upload secret findings
      if: ${{ always() }}
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: trivy-secrets.sarif
        category: aviato-secret-scan
        ref: ${{ needs.security--resolve-target.outputs.canonical-ref }}
        sha: ${{ needs.security--resolve-target.outputs.analyzed-sha }}
  security--heartbeat:
    name: Security baseline heartbeat
    if: ${{ always() }}
    needs:
    - security--resolve-target
    - security--codeql
    - security--dependency-review
    - security--dependency-scan
    - security--secret-scan
    runs-on: ubuntu-latest
    permissions: *id001
    env:
      CODEQL_RESULT: ${{ needs.security--codeql.result }}
      DEPSCAN_RESULT: ${{ needs.security--dependency-scan.result }}
      SECRET_RESULT: ${{ needs.security--secret-scan.result }}
      DEPREVIEW_RESULT: ${{ needs.security--dependency-review.result }}
      RUN_CODEQL: true
      CODEQL_LANGUAGES: python
      ANALYZED_REF: ${{ needs.security--resolve-target.outputs.canonical-ref }}
      ANALYZED_SHA: ${{ needs.security--resolve-target.outputs.analyzed-sha }}
    steps:
    - name: Emit heartbeat
      shell: bash
      run: |
        mkdir -p heartbeat
        printf '{"tool":"aviato-security-baseline","analyzed_ref":"%s","analyzed_sha":"%s","sast":"%s","dependency":"%s","secret":"%s","review":"%s","completed":true}\n' \
          "${ANALYZED_REF}" "${ANALYZED_SHA}" "${CODEQL_RESULT}" "${DEPSCAN_RESULT}" "${SECRET_RESULT}" "${DEPREVIEW_RESULT}" \
          > heartbeat/aviato-security-heartbeat.json
        cat heartbeat/aviato-security-heartbeat.json
    - name: Gate on required scans
      shell: bash
      run: |
        # The gating scans must have SUCCEEDED (skipped/failed/cancelled = broken, §5.14).
        for name in DEPSCAN SECRET; do
          eval "result=\${${name}_RESULT}"
          if [ "${result}" != "success" ]; then
            echo "::error::${name} scan did not run successfully (result=${result}); broken (§5.14)."
            exit 1
          fi
        done
        # SAST must not silently no-op: if CodeQL is enabled (run-codeql=true) it MUST
        # have succeeded. A skipped CodeQL (e.g. run-codeql=true but codeql-languages
        # left empty) is broken, not clean — absence reads as broken (§5.14/§8.16).
        if [ "${RUN_CODEQL}" = "true" ]; then
          if [ -z "${CODEQL_LANGUAGES}" ]; then
            echo "::error::run-codeql is true but codeql-languages is empty; SAST cannot run. Set codeql-languages (§5.14/§8.16)."
            exit 1
          fi
          if [ "${CODEQL_RESULT}" != "success" ]; then
            echo "::error::CodeQL SAST was enabled but did not succeed (result=${CODEQL_RESULT}); broken (§5.14/§8.16)."
            exit 1
          fi
        else
          # §2.13/§5.14: SAST is an ALWAYS-ON baseline — no profile may turn it off. A caller
          # passing run-codeql=false would skip SAST and (previously) pass the gate silently.
          # That is the §8.16 fail-open the baseline forbids: reject it.
          echo "::error::SAST is disabled (run-codeql=${RUN_CODEQL}); the §2.13 security baseline is always-on and cannot be turned off (§5.14/§8.16)."
          exit 1
        fi
    - name: Upload heartbeat
      uses: actions/upload-artifact@v7
      with:
        name: aviato-security-heartbeat-${{ needs.security--resolve-target.outputs.analyzed-sha }}
        path: heartbeat/aviato-security-heartbeat.json
        retention-days: 30
  security:
    name: security (aggregate)
    if: ${{ always() }}
    needs:
    - security--resolve-target
    - security--privilege-probe
    - security--codeql
    - security--dependency-review
    - security--dependency-scan
    - security--secret-scan
    - security--heartbeat
    runs-on: ubuntu-latest
    permissions: {}
    env:
      RESULT_0: ${{ needs.security--resolve-target.result }}
      RESULT_1: ${{ needs.security--privilege-probe.result }}
      RESULT_2: ${{ needs.security--codeql.result }}
      RESULT_3: ${{ needs.security--dependency-review.result }}
      RESULT_4: ${{ needs.security--dependency-scan.result }}
      RESULT_5: ${{ needs.security--secret-scan.result }}
      RESULT_6: ${{ needs.security--heartbeat.result }}
    steps:
    - name: Aggregate security
      shell: bash
      run: |
        set -euo pipefail
        # Aggregate the inlined security job graph: fail if any hoisted job
        # failed or was cancelled (a skipped job — e.g. a PR-only path on a tag run — is fine),
        # so downstream `needs.security.result` matches the reusable-call semantics.
        for r in "${RESULT_0}" "${RESULT_1}" "${RESULT_2}" "${RESULT_3}" "${RESULT_4}" "${RESULT_5}" "${RESULT_6}"; do
          case "${r}" in
            failure|cancelled) echo "::error::inlined security job did not succeed (${r})."; exit 1 ;;
          esac
        done
        echo "security: all inlined jobs succeeded or were skipped."
  common-lint:
    name: Common lint
    if: ${{ !cancelled() && (github.ref_type != 'tag') }}
    needs:
    - pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.runner || '["ubuntu-latest"]') }}
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install lint toolchain (hash-pinned, §11.3)
      shell: bash
      run: |
        set -euo pipefail
        # §11.3, applied to the gate itself: the job that enforces exact pinning installs its
        # OWN enforcing tools (yamllint, zizmor) from a fully hashed transitive closure, into
        # the interpreter declared above — never from an ambient `python` resolving floating
        # transitives from PyPI at gate time. Regenerate per the lockfile's header.
        python3 -m pip install --quiet --require-hashes -r .github/aviato/lint-tools.lock
    - name: yamllint (blocking)
      shell: bash
      run: |
        # Honor the repo's own yamllint config when present; otherwise fall back to a
        # baseline that accepts the Aviato-generated caller workflows (long `if:`
        # expressions, GitHub's truthy `on:` key) without disabling syntax checks.
        if [ -f .yamllint ] || [ -f .yamllint.yaml ] || [ -f .yamllint.yml ]; then
          yamllint -s .
        else
          yamllint -s -d '{extends: default, rules: {braces: disable, comments: disable, comments-indentation: disable, document-start: disable, truthy: disable, empty-lines: {max: 2, max-end: 1}, line-length: {max: 240}}}' .
        fi
    - name: actionlint (blocking)
      shell: bash
      env:
        ACTIONLINT_VERSION: 1.7.12
        ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      run: |
        set -euo pipefail
        if [ ! -d .github/workflows ]; then
          echo "No workflows to lint."; exit 0
        fi
        # §11.3: pin the shell-fetched tool by checksum, not by mutable version alone.
        tarball="${RUNNER_TEMP:-/tmp}/actionlint.tar.gz"
        curl -sSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -o "${tarball}"
        echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c -
        sudo tar -xz -C /usr/local/bin -f "${tarball}" actionlint
        actionlint
    - name: Supply-chain pins — zizmor (blocking, §11.3)
      shell: bash
      run: |
        set -euo pipefail
        if [ ! -d .github/workflows ]; then echo "No workflows to check."; exit 0; fi
        # Decision 2: self-contained supply-chain gate — zizmor installed from the hash-pinned
        # lockfile above (no aviato install) with the bundled Aviato config embedded. Gated
        # audits: unpinned-uses, unpinned-images, template-injection.
        cfg="${RUNNER_TEMP:-/tmp}/aviato-zizmor.yml"
        cat > "${cfg}" <<'AVIATO_ZIZMOR_CONFIG'
        # §11.3 single source of truth for action/image pinning, shipped in the wheel and passed to
        # zizmor via `--config` by `aviato lint-actions` (so every consumer gets the Library policy
        # without authoring their own config). Most-specific pattern wins.
        #
        # GATED audits (aviato/plugins/zizmor_scan.py:_GATED_AUDITS): `unpinned-uses`,
        # `unpinned-images`, and — operator decision 2026-06 (finding 18) — `template-injection`.
        # zizmor still runs its other audits; those findings are intentionally ignored here
        # until explicitly adopted (a deliberate scope, not an oversight).
        rules:
          unpinned-uses:
            config:
              policies:
                actions/*: ref-pin          # first-party GitHub — branch/tag allowed
                github/*: ref-pin
                # Phase 3 (belt-and-braces): the former `{library.repository}/*: ref-pin` self-ref exemption
                # is REMOVED. Consumer callers are now fully flattened — the Library's reusable workflows are
                # inlined, so no rendered workflow carries a cross-repo `<owner>/aviato/.github/workflows/…`
                # `uses:` any longer. Defaulting that owner to hash-pin turns zizmor into an ENFORCEMENT
                # mechanism for "no library reusable `uses:` refs": a resurrected cross-repo reusable ref
                # (which can never be a 40-hex SHA) hard-fails the gate rather than passing under ref-pin.
                "*": hash-pin                # everything else: 40-hex SHA required
        AVIATO_ZIZMOR_CONFIG
        # The report goes to a FILE, not a pipe: `python3 - <<HEREDOC` already takes the
        # program on stdin, so piping the findings in as well is the redirect shellcheck
        # rejects as SC2259 — and the heredoc wins, leaving the reader with an empty
        # stdin. Passing the path as argv keeps both channels distinct (issue #24).
        findings="${RUNNER_TEMP:-/tmp}/aviato-zizmor.json"
        zizmor --config "${cfg}" --format json --no-exit-codes --offline --persona=auditor --no-ignores .github/workflows > "${findings}"
        python3 - "${findings}" <<'PYZIZMOR'
        import json, sys
        gated = {"unpinned-uses", "unpinned-images", "template-injection"}
        with open(sys.argv[1], encoding="utf-8") as report:
            data = json.load(report)
        if not isinstance(data, list):
            print("::error::unexpected zizmor JSON shape; failing closed"); sys.exit(1)
        hits = sorted({f.get("ident") for f in data if isinstance(f, dict) and f.get("ident") in gated})
        if hits:
            print("::error::zizmor supply-chain findings (§11.3): " + ", ".join(hits)); sys.exit(1)
        print("zizmor supply-chain pins OK.")
        PYZIZMOR
    - name: Supply-chain pins — fetch-execute + tool pins (bounded, §11.3)
      shell: bash
      run: |
        set -euo pipefail
        if [ ! -d .github/workflows ]; then echo "No workflows to check."; exit 0; fi
        # Decision 2 (bounded): the managed fetch-execute + pip exact-pin heuristic. It lives
